<!DOCTYPE html><html lang=it><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>NutriCoach v2.20.5</title>
<link rel=stylesheet href=/static/style.css>
<style>
/* ONBOARDING TOUR */
#onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
.onboarding-card{background:var(--card,#fff);border-radius:16px;padding:32px;max-width:420px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.onboarding-card h2{font-size:1.5rem;margin:0 0 8px}
.onboarding-card p{font-size:14px;color:var(--text2,#666);margin:0 0 20px;line-height:1.5}
.onboarding-steps{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.onboarding-step{width:10px;height:10px;border-radius:50%;background:var(--border,#ddd);transition:all .3s}
.onboarding-step.active{background:var(--primary,#6366f1);transform:scale(1.3)}
.onboarding-btns{display:flex;justify-content:space-between;gap:12px}
.onboarding-btns .btn{flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;border:none;transition:opacity .2s}
.btn-skip{background:transparent;color:var(--text2,#888)}.btn-skip:hover{opacity:.7}
.btn-next{background:var(--primary,#6366f1);color:#fff}.btn-next:hover{opacity:.9}
.btn-finish{background:#22c55e;color:#fff}.btn-finish:hover{opacity:.9}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head><body>
<div class=sidebar>
  <div class=logo><span id=brand-logo></span> <span id=brand-name>NutriCoach</span></div>
  <div class="nav-item active" data-nav=dashboard onclick="nav('dashboard')" title="Dashboard: panoramica studio"><span class=ico>📊</span><span>Dashboard</span></div>
  <div class=nav-item data-nav=pazienti onclick="nav('pazienti')" title="Elenco e gestione pazienti"><span class=ico>👥</span><span>Pazienti</span></div>
  <div class=nav-item data-nav=bia onclick="nav('bia')"><span class=ico>🔬</span><span>BIA</span></div>
  <div class=nav-item data-nav=dieta onclick="nav('dieta')" title="Piani alimentari: crea e modifica"><span class=ico>🍽️</span><span>Dieta</span></div>
  <div class=nav-item data-nav=agenda onclick="nav('agenda')" title="Calendario appuntamenti"><span class=ico>📅</span><span>Agenda</span></div>
  <div class=nav-item data-nav=notifiche onclick="nav('notifiche')"><span class=ico>📨</span><span>Notifiche</span></div>
  <div class=nav-item data-nav=archivio onclick="nav('archivio')"><span class=ico>📁</span><span>Archivio</span></div>
  <div class=nav-item data-nav=ricettario onclick="nav('ricettario')" title="Ricettario: crea e gestisci ricette"><span class=ico>📖</span><span>Ricettario</span></div>
  <div class=spacer></div>
  <div class=nav-item style=cursor:pointer;font-size:11px onclick=showStats() title="Statistiche studio">📊</div>
    <div class=nav-item style=cursor:pointer;font-size:11px onclick=showSettings() title="Impostazioni studio e brand">⚙️</div>
    <div class=nav-item style=cursor:pointer;font-size:11px;position:relative onclick=toggleNotifDropdown() title="Notifiche: messaggi e promemoria" id=bell-btn>🔔<span id=bell-badge style="display:none;background:#ef4444;color:#fff;font-size:9px;padding:0 4px;border-radius:8px;position:absolute;top:-2px;right:-4px">0</span></div>
    <div class=nav-item style=cursor:pointer;font-size:11px onclick=doLogout() title="Esci dalla sessione">🚪</div>
  <button class="btn btn-sm btn-outline" onclick=toggleTheme() id=theme-btn title="Cambia tema chiaro/scuro">🌙</button>
  <div class=version>v2.20.5 · Dietowin</div>
</div>
<div id=notif-dropdown style="display:none;position:fixed;top:50px;right:50px;width:320px;max-height:360px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:12px">
  <div style=display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border)><b>🔔 Notifiche</b><button class="btn btn-sm" onclick="closeNotifDropdown();markAllNotifRead()">✔️ Tutte lette</button></div>
  <div id=notif-list></div></div>
<div class=main>
  <div class=topbar>
    <h1 id=page-title>Dashboard</h1>
    <input id=search-input placeholder="Cerca paziente..." oninput=onSearch(this.value)>
    <button class=btn onclick="nav('pazienti')">+ Nuovo</button>
  </div>
  <div id=view></div>
</div>
<div id=modal-root></div>
<div id=toast></div>
<script>
const API=''; let ST={nav:'dashboard',clients:[],cid:null,cats:[],name:null,weight:null};
function $(id){return document.getElementById(id)}
function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}
function esc(s){return s==null?'':String(s).replace(/[&<>]/g,c=>({'&':'&','<':'<','>':'>'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function init(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function clr(){const c=['#6366f1','#0d9488','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];return c[Math.floor(Math.random()*c.length)]}

/* === ENHANCED TOAST with 4 types + auto-dismiss === */
function toast(m,opt){opt=opt||{};const t=$('toast');t.textContent='';const ic={success:'✅',error:'❌',warn:'⚠️',info:'ℹ️'};t.className='';if(opt.type)t.classList.add('toast-'+opt.type);t.innerHTML=(ic[opt.type]||'')+' '+esc(m);t.classList.add('show');const dur=opt.duration||(opt.type==='error'?5000:opt.type==='warn'?3500:opt.type==='info'?2500:2400);if(dur)setTimeout(()=>t.classList.remove('show'),dur)}

/* === ENHANCED API HELPERS with error handling + 401 interceptor === */
async function jget(u){try{const r=await fetch(API+u);if(r.status===401){localStorage.removeItem('token');clr();$('login-overlay')&&($('login-overlay').style.display='flex');toast('Sessione scaduta, effettua di nuovo il login',{type:'warn'});return null}if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){if(!e.message.includes('Failed to fetch'))toast('Errore caricamento: '+e.message,{type:'error'});return null}}
async function jpost(u,b){try{const r=await fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){localStorage.removeItem('token');clr();$('login-overlay')&&($('login-overlay').style.display='flex');toast('Sessione scaduta, effettua di nuovo il login',{type:'warn'});return null}if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){if(!e.message.includes('Failed to fetch'))toast('Errore salvataggio: '+e.message,{type:'error'});return null}}
async function jdel(u){try{const r=await fetch(API+u,{method:'DELETE'});if(r.status===401){localStorage.removeItem('token');clr();$('login-overlay')&&($('login-overlay').style.display='flex');toast('Sessione scaduta, effettua di nuovo il login',{type:'warn'});return null}if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){if(!e.message.includes('Failed to fetch'))toast('Errore eliminazione: '+e.message,{type:'error'});return null}}
async function jpatch(u,b){try{const r=await fetch(API+u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.status===401){localStorage.removeItem('token');clr();$('login-overlay')&&($('login-overlay').style.display='flex');toast('Sessione scaduta, effettua di nuovo il login',{type:'warn'});return null}if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){if(!e.message.includes('Failed to fetch'))toast('Errore aggiornamento: '+e.message,{type:'error'});return null}}

/* === LOADING STATE HELPER for buttons === */
function setLoading(el,loading,label){if(!el)return;if(loading){el._origText=el.innerHTML;el._origDisabled=el.disabled;el.disabled=true;el.classList.add('btn-loading');if(label)el.innerHTML=label}else{el.disabled=el._origDisabled||false;el.classList.remove('btn-loading');if(el._origText)el.innerHTML=el._origText;delete el._origText;delete el._origDisabled}}

/* === AI STATUS INDICATOR === */
function showAIStatus(msg,containerId){const c=document.getElementById(containerId);if(!c)return;c.innerHTML='<span class="ai-status"><span class="dot"></span> '+esc(msg)+'</span>'}
function hideAIStatus(containerId){const c=document.getElementById(containerId);if(c)c.innerHTML=''}

/* === FORMAT HELPERS for messages === */
function errMsg(e,fallback){const m=(e&&e.message)||(e&&String(e))||fallback||'Operazione non riuscita';return '<div class="msg-error">'+esc(m)+'</div>'}
function warnMsg(m){return '<div class="msg-warn">'+esc(m)+'</div>'}
function infoMsg(m){return '<div class="msg-info">'+esc(m)+'</div>'}
function successMsg(m){return '<div class="msg-success">'+esc(m)+'</div>'}

// NAVIGATION
// NAVIGATION
async function nav(n){
  ST.nav=n;
  qsa('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.nav===n));
  $('page-title').textContent={'dashboard':'Dashboard','pazienti':'Pazienti','bia':'BIA & Misure','dieta':'Dieta','agenda':'Agenda','notifiche':'Notifiche','archivio':'Archivio','ricettario':'Ricettario'}[n]||n;
  if(n==='dashboard')await loadDashboard();
  else if(n==='pazienti')await loadPazienti();
  else if(n==='bia')await loadBIA();
  else if(n==='dieta')loadDieta();
  else if(n==='agenda')loadAgenda();
  else if(n==='notifiche')loadNotifiche();
  else if(n==='archivio')loadArchivio();
  else if(n==='ricettario')loadRicettario();
}
// THEME TOGGLE
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('nc-theme',next);
  $('theme-btn').textContent=next==='dark'?'☀️':'🌙';
}
(function(){const t=localStorage.getItem('nc-theme');if(t){document.documentElement.setAttribute('data-theme',t);const b=$('theme-btn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}})();
// RICETTARIO
async function loadRicettario(q){
  const qp=q||'';
  const r=await jget('/api/recipes?q='+encodeURIComponent(qp));
  const rc=r.recipes||[];
  $('view').innerHTML=`<div class=row style=margin:8px 0>
    <input id=rq placeholder="Cerca ricetta..." value="${esc(qp)}" oninput="loadRicettario(this.value)" style=flex:1>
    <button class=btn onclick=showAddRecipe()>➕ Nuova ricetta</button>
  </div>
  ${rc.length?rc.map(r=>`<div class=card><div style=display:flex;justify-content:space-between;align-items:center>
    <b>${esc(r.name)}</b>
    <div><span class=tag>${esc(r.category||'—')}</span> <span style=font-size:10px;color:var(--text2)>${r.servings||4} porz.</span></div>
  </div>
  <div style=font-size:10px;color:var(--text2);margin:2px 0>${(Array.isArray(r.ingredients)?r.ingredients:(typeof r.ingredients==='string'&&r.ingredients.trim()?r.ingredients.split(',').map(s=>{const p=s.split(':');return {name:p[0]||s,grams:parseFloat(p[1])||0}}):[])).map(i=>(i.name||'?')+(i.grams?` (${i.grams}g)`:'')).join(', ')||'—'}</div>
  <div style=font-size:10px;margin:2px 0>${(r.macros&&(r.macros.kcal||r.macros.protein_g||r.macros.carbs_g||r.macros.fat_g))?`📊 ${r.macros.kcal||'?'}kcal · P${r.macros.protein_g||'?'}g · C${r.macros.carbs_g||'?'}g · F${r.macros.fat_g||'?'}g`:'📊 —'}</div>
  <div style=margin-top:4px;display:flex;gap:4px>
    <button class="btn btn-sm btn-outline" onclick="applyRecipe(${r.id},'${esc(r.name)}')">➕ Al piano</button>
    <button class="btn btn-sm btn-danger" onclick="delRecipe(${r.id})" title="Elimina ricetta">🗑️</button>
  </div></div>`).join(''):'<div class=card empty>Nessuna ricetta. Creane una!</div>'}`;
}
function showAddRecipe(){
  modal(`<div class=card><b>📖 Nuova ricetta</b>
  <label>Nome</label><input id=rn>
  <label>Categoria</label><select id=rc><option value=antipasti>Antipasti</option><option value=primi>Primi</option><option value=secondi selected>Secondi</option><option value=contorni>Contorni</option><option value=dolci>Dolci</option></select>
  <label>Porzioni</label><input id=rs type=number value=4>
  <label>Ingredienti (food_id:grammi, separati da virgola)</label><textarea id=ri rows=3 placeholder="es. 1:200, 29:150, 45:100"></textarea>
  <div style=font-size:10px;color:var(--text2)>Usa ID alimento (es. 1=petto pollo, 29=pasta, ecc.)</div>
  <label>Istruzioni</label><textarea id=rt rows=3></textarea>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveRecipe()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveRecipe(){
  const name=$('rn').value; if(!name){toast('Inserisci nome');return}
  const ingText=$('ri').value;
  const ingredients=[];
  if(ingText){
    ingText.split(',').forEach(p=>{
      const parts=p.trim().split(':');
      if(parts.length===2) ingredients.push({food_id:parseInt(parts[0]),name:'',grams:parseFloat(parts[1])||100});
    });
  }
  const r=await jpost('/api/recipes',{
    name, category:$('rc').value, servings:parseInt($('rs').value)||4,
    ingredients, instructions:$('rt').value
  });
  if(r&&r.ok){toast('Ricetta salvata ✓');closeModal();loadRicettario();}
  else toast('Errore salvataggio ricetta');
}
async function delRecipe(rid){
  if(!await showConfirm('Eliminare ricetta?','Questa azione è irreversibile.',{danger:true}))return;
  const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent='⏳...'}
  await jdel('/api/recipes/'+rid);
  toast('Ricetta eliminata ✓',{type:'success'});loadRicettario();
}
function deleteBIARow(bid,ctx){if(!confirm('Eliminare?'))return;jdel('/api/bia/'+bid).then(function(){ctx==='hub'?loadBIAReading():loadPatientBIA()})}
async function applyRecipe(rid,rname){
  if(!ST.cid){toast('Apri prima un paziente');return}
  if(!await showConfirm('Applicare ricetta?',`Applicare "${rname}" al paziente corrente?`))return;
  modal(`<div class=card><b>📋 Applica: ${esc(rname)}</b>
  <div class=field-row><div><label>Giorno</label><select id=ap-day>${['lun','mar','mer','gio','ven','sab','dom'].map(d=>`<option value=${d}>${d}</option>`).join('')}</select></div>
  <div><label>Pasto</label><select id=ap-meal>${['colazione','pranzo','cena','spuntino','spuntino2'].map(m=>`<option value=${m}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`).join('')}</select></div></div>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick="doApplyRecipe(${rid})">📋 Applica</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function doApplyRecipe(rid){
  const day=$('ap-day').value;const meal=$('ap-meal').value;
  const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent='⏳...'}
  const r=await jpost('/api/recipes/'+rid+'/apply',{patient_id:ST.cid,day,meal});
  closeModal();
  if(r&&r.ok)toast(`Ricetta applicata (${r.items_added} ingredienti) ✓`,{type:'success'});
  else toast('Errore applicazione',{type:'error'});
}
// DASHBOARD
async function loadDashboard(){
  const cls=await jget('/api/patients');
  ST.clients=cls; const n=cls.length;
  $('view').innerHTML=`<div class=row style=margin-bottom:12px>
    <div class=card style=flex:1;text-align:center><b>${n}</b><div class=meta>Pazienti</div></div>
    <div class=card style=flex:1;text-align:center><b>${cls.filter(c=>c.goal).length}</b><div class=meta>Con obiettivo</div></div>
    <div class=card style=flex:1;text-align:center><b>0</b><div class=meta>App. oggi</div></div>
  </div>
  <div class=card><b>👥 Ultimi pazienti</b>
  ${cls.slice(0,5).map(c=>`<div class=patient-card onclick="openPatient(${c.id})"><div class=init style=background:${clr()}>${init(c.name)}</div><div class=info><b>${esc(c.name)}</b><div class=meta>${c.goal||'—'} · ${c.sport||''}</div></div></div>`).join('')||'<div class=empty>Nessun paziente</div>'}</div>
  <div class=card id=dash-trends style=max-height:180px;overflow:auto><b>📈 Trend ultime letture</b><div style=font-size:10px;color:var(--text2) id=dash-trend-content>Caricamento...</div></div>
  <div class=row style=margin-top:12px>
    <button class="btn btn-sm btn-outline" onclick="doBackup()">💾 Backup ora</button>
    <button class="btn btn-sm btn-outline" onclick="exportPatients()">📤 Export CSV</button>
  </div>`;
  // Carica trend per i primi 3 pazienti
  Promise.all(cls.slice(0,3).map(c=>jget('/api/patients/'+c.id+'/bia-trend').then(r=>{if(r&&r.length>1){return {name:c.name,trend:r}}return null}).catch(()=>null))).then(trends=>{
    const t=trends.filter(Boolean);
    $('dash-trend-content').innerHTML=t.length?t.map(p=>`<div style=margin:2px 0><b>${esc(p.name)}</b> ${trendSVG(p.trend.slice(-6).map(x=>({v:x.weight_kg})))}</div>`).join(''):'<span>Nessun trend disponibile</span>';
  });
}
async function showAdherence(pid){
  const r=await jget('/api/patients/'+pid+'/adherence');
  const ad=r.adherence||[];
  if(!ad.length){toast('Nessun piano attivo');return}
  modal(`<div class=card><b>📊 Aderenza dieta</b><table class=cmp-table><tr><th>Giorno</th><th>Target</th><th>Effettivo</th><th>%</th></tr>
  ${ad.map(d=>{const col=d.completion_pct>100?'#ef4444':(d.completion_pct<70?'#f59e0b':'#22c55e');return `<tr><td>${d.label}</td><td>${d.target_kcal} kcal</td><td>${d.actual_kcal} kcal</td><td><b style="color:${col}">${d.completion_pct}%</b></td></tr>`}).join('')}</table>
  <div style=margin-top:8px><button class=btn onclick=closeModal()>Chiudi</button></div></div>`);
}
async function doBackup(){
  toast('Backup in corso...');
  const r=await jpost('/api/backup',{});
  if(r&&r.ok)toast('Backup creato ✓ '+r.timestamp);else toast('Errore backup');
}
async function exportPatients(){
  window.open('/api/export/patients','_blank');
}
// PAZIENTI LIST
async function loadPazienti(){
  const cls=await jget('/api/patients');
  ST.clients=cls;
  $('view').innerHTML=`<div class=row style=margin-bottom:8px>
    <button class="btn btn-primary" onclick=showNewPatient()>➕ Nuovo paziente</button>
    <button class="btn btn-outline" onclick=showCompare()>⚖️ Confronta</button>
    <span class=meta>${cls.length} pazienti</span>
  </div>
  ${cls.map(c=>`<div class=patient-card onclick="openPatient(${c.id})"><div class=init style=background:${clr()}>${init(c.name)}</div>
    <div class=info><b>${esc(c.name)}</b><div class=meta>${c.goal||'—'} · ${c.sport||''}</div></div>
  </div>`).join('')||'<div class=card><div class=empty>Clicca "+ Nuovo paziente" per iniziare</div></div>'}`;
}
function onSearch(q){
  const m=ST.clients.find(c=>c.name&&c.name.toLowerCase().includes(q.toLowerCase()));
  if(m)openPatient(m.id);
  else if(q.length>1)toast('Nessun paziente trovato');
}
// NEW PATIENT
function showNewPatient(){
  modal(`<div class=card><b>➕ Nuovo paziente</b>
  <div class=field-row><div><label>Nome *</label><input id=np-name maxlength=60></div><div><label>Sesso</label><select id=np-sex><option value=M>M</option><option value=F>F</option></select></div></div>
  <div class=field-row><div><label>Telefono</label><input id=np-phone></div><div><label>Email</label><input id=np-email type=email></div></div>
  <div class=field-row><div><label>Obiettivo</label><input id=np-goal></div><div><label>Sport</label><input id=np-sport></div></div>
  <div style=margin-top:10px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveNewPatient()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveNewPatient(){
  const b={name:$('np-name').value,sex:$('np-sex').value,phone:$('np-phone').value,email:$('np-email').value,goal:$('np-goal').value,sport:$('np-sport').value};
  if(!b.name){toast('Inserisci il nome');return}
  const r=await jpost('/api/patients',b);
  if(r&&r.ok){toast('Paziente creato ✓');closeModal();nav('pazienti')}else toast('Errore');
}
// OPEN PATIENT
async function openPatient(cid){
  ST.cid=cid;
  const c=await jget('/api/patients/'+cid);
  ST.name=c.name; ST.weight=c.weight_kg||null;
  $('page-title').textContent=esc(c.name);
  $('view').innerHTML=`<div class=card><div class=row><div style=width:40px;height:40px;border-radius:50%;background:${clr()};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700>${init(c.name)}</div>
    <div style=flex:1><b>${esc(c.name)}</b><div class=meta>${c.sex||'?'} · ${c.goal||'—'} · ${c.sport||'—'} ${c.allergies?`⚡ ${esc(c.allergies)}`:''} ${c.language&&c.language!=='it'?`🌐 ${c.language}`:''}</div></div>
  ${c.phone?`<button class="btn btn-sm btn-outline" onclick="window.open('https://wa.me/${c.phone.replace(/[^0-9]/g,'')}','_blank')">💬</button>`:''}
  <button class="btn btn-sm btn-danger" onclick=deletePatient(${c.id})>✕</button>
  <button class="btn btn-sm btn-outline" onclick=genPortal()>🔗 Portale</button></div></div>
  <div class=tab-bar id=ptabs>
    <button class="tab-btn active" onclick=switchTab(this,'anamnesi')>Anamnesi</button>
    <button class=tab-btn onclick=switchTab(this,'bia')>BIA</button>
    <button class=tab-btn onclick=switchTab(this,'misure')>Misure</button>

async function genPlan(){
  const pre=$('gp-preset')?$('gp-preset').value:'';
  const targets={kcal:parseFloat($('gp-k').value),protein_pct:parseFloat($('gp-p').value),carb_pct:parseFloat($('gp-c').value),fat_pct:parseFloat($('gp-f').value)};
  const conds=Array.from(qsa('#gp-cd input:checked')).map(c=>c.value);
  const opts={meals:parseInt($('gp-fr').value),days:['lun','mar','mer','gio','ven','sab','dom'],conditions:conds,preset:pre};
  closeModal();$('patient-pane').innerHTML='<div class=card style=text-align:center;padding:32px><div class=spinner></div><div style=margin-top:8px;color:var(--text2);font-size:13px>🧠 Generazione piano in corso…</div></div>';toast('Generazione...');
  const pl=await jpost('/api/patients/'+ST.cid+'/plan/generate',{targets,options:opts,preset:pre});
  if(pl&&pl.days){
    // apply plan items
    await jpost('/api/patients/'+ST.cid+'/diet/clear');
    for(const d of pl.days){
      const dk=(d.day||'').slice(0,3).toLowerCase();
      if(!d.meals)continue;
      for(const mp of d.meals){
        const mk=mp.meal||'';
        for(const f of (mp.items||[])){
          if(f&&f.food)await jpost('/api/patients/'+ST.cid+'/diet-items',{day:dk,meal:mk,food:f.food,grams:f.g||0});
        }
      }
    }
    toast('Piano generato ✓');loadPatientDieta()
  } else toast('Errore');
}

// DIARIO PASTI
async function loadDiario(){
  const p=[];
  try{const pl=await jget('/api/patients/'+ST.cid+'/diet-plan');if(pl.id)for(const d of pl.days||[]){for(const m of d.meals||[]){p.push({date:d.date||'oggi',meal:m.time||m.meal||'Pasto',food:m.food||m.name||'',food_id:m.food_id})}}}catch(e){}
  const today=new Date().toISOString().slice(0,10);
  const entries=await jget('/api/patients/'+ST.cid+'/diary',{params:{date:today}});
  const consumed={};let sr={};for(const e of entries){if(e.meal==='__self_report__'){try{sr[e.food_name]=JSON.parse(e.notes||'{}');sr[e.food_name]._eid=e.id}catch(e2){}}else consumed[e.meal+'|'+e.food_name]=e;}
  const curSr=sr._today||{};
  $('patient-pane').innerHTML=`<div class=row style=margin-bottom:8px><b>📝 Diario pasti — ${today}</b></div>
  ${p.length?`<div class=card>${p.map(m=>{const k=m.meal+'|'+m.food,c=consumed[k],done=c?c.consumed:null;return `
    <div style=display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)>
      <span><b>${esc(m.meal)}</b> — ${esc(m.food)}</span>
      <span>
        ${done===null?`<button class="btn btn-sm" onclick=markMeal('${today}','${esc(m.meal)}','${esc(m.food)}',${m.food_id||'null'},1)>✅ Fatto</button><button class="btn btn-sm" onclick=markMeal('${today}','${esc(m.meal)}','${esc(m.food)}',${m.food_id||'null'},0)>❌ Saltato</button>`:done?`<span style=color:#22c55e>✅ Consumato</span>`:`<span style=color:#ef4444>❌ Saltato</span>`}
      </span>
    </div>`}).join('')}</div>`:'<div class=card style=color:var(--text2);font-size:11px>Nessun piano dieta attivo. <button class="btn btn-sm btn-outline" onclick=loadPatientDieta()>🍽️ Crea dieta</button></div>'}
  <div class=card><b>✏️ Pasto extra</b>
  <div class=row style=gap:4px><input id=de-meal placeholder=Pasto style=flex:1><input id=de-food placeholder=Cibo style=flex:2></div>
  <div style=margin-top:4px;display:flex;gap:8px><button class="btn btn-sm btn-primary" onclick=addDiaryEntry()>➕ Aggiungi</button></div></div>
  <div class=card><b>😊 Auto-report giornaliero</b>
  <div class=row style=gap:8px;flex-wrap:wrap>
    <div><label>Umore</label><div id=sel-mood class=row style=gap:4px;margin-top:2px>
      ${['😢','😐','🙂','😊','😄'].map(e=>`<button class="btn btn-sm ${curSr.mood===e?'btn-primary':''}" onclick=setMood('${e}')>${e}</button>`).join('')}</div></div>
    <div><label>Fame (${curSr.hunger!==undefined?curSr.hunger:'-'})</label><input type=range min=0 max=10 value=${curSr.hunger!==undefined?curSr.hunger:5} id=sl-hunger></div>
    <div><label>Sazietà (${curSr.satisfaction!==undefined?curSr.satisfaction:'-'})</label><input type=range min=0 max=10 value=${curSr.satisfaction!==undefined?curSr.satisfaction:5} id=sl-sat></div>
  </div>
  <div style=margin-top:4px;display:flex;gap:8px><button class="btn btn-sm btn-primary" onclick=saveSelfReport('${today}')>💾 Salva</button></div></div>`;}
function setMood(e){document.getElementById('sel-mood').querySelectorAll('button').forEach(b=>b.classList.remove('btn-primary'));event.target.classList.add('btn-primary');}
async function saveSelfReport(date){
  const mood=[...document.getElementById('sel-mood').querySelectorAll('.btn-primary')].map(b=>b.textContent)[0];
  const hunger=parseInt(document.getElementById('sl-hunger').value)||0;
  const sat=parseInt(document.getElementById('sl-sat').value)||0;
  if(!mood){toast('Seleziona umore');return}
  const data=JSON.stringify({mood,hunger,satisfaction:sat});
  const existing=await jget('/api/patients/'+ST.cid+'/diary',{params:{date}});
  const prev=existing.find(e=>e.meal==='__self_report__'&&e.food_name==='_today');
  if(prev)await jpatch('/api/diary/'+prev.id,{notes:data});
  else await jpost('/api/patients/'+ST.cid+'/diary',{date,meal:'__self_report__',food_name:'_today',notes:data});
  toast('💾 Salvato!');loadDiario();
}
async function markMeal(date,meal,food,food_id,consumed){
  await jpost('/api/patients/'+ST.cid+'/diary',{date,meal,food_name:food,food_id,consumed});
  toast(consumed?'✅ Segnato consumato':'❌ Segnato saltato');loadDiario();
}
async function addDiaryEntry(){
  const meal=$('de-meal').value, food=$('de-food').value;
  if(!meal||!food){toast('Compila pasto e cibo');return}
  await jpost('/api/patients/'+ST.cid+'/diary',{date:new Date().toISOString().slice(0,10),meal,food_name:food,consumed:1,notes:''});
  toast('✅ Aggiunto');loadDiario();
}

function showQuestionnaire(type){
  jget('/api/questionnaires').then(qq=>{
    const q=qq.questionnaires[type];
    if(!q){toast('Questionario non trovato');return}
    const max=q.max_score||q.questions.length;
    let html=`<div class=card><b>${esc(q.name)}</b><br><span style=font-size:10px;color:var(--text2)>${esc(q.description)}</span>`;
    q.questions.forEach((qs,i)=>{
      if(type==='vas'){
        html+=`<label style=display:block;margin:6px 0>${esc(qs)}<br><input type=range min=0 max=10 value=5 style=width:100% class=q-ans data-idx=${i}><span style=font-size:10px;color:var(--text2) id=vas-v${i}>5</span></label>`;
      } else {
        html+=`<label class=chk style=margin:2px 0><input type=checkbox class=q-ans data-idx=${i}>${esc(qs)}</label>`;
      }
    });
    html+=`<div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveQuestionnaire('${type}',${max})>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`;
    modal(html);
    // VAS slider listeners
    if(type==='vas')qsa('.q-ans').forEach(el=>{el.oninput=()=>{const id='vas-v'+el.dataset.idx;const s=$('vas-v'+el.dataset.idx);if(s)s.textContent=el.value}});
  });
}
async function saveQuestionnaire(type,maxScore){
  const els=qsa('.q-ans');
  let score=0;
  const answers=[];
  els.forEach(el=>{
    const v=el.type==='checkbox'?el.checked?1:0:parseInt(el.value)||0;
    score+=v;
    answers.push(v);
  });
  const r=await jpost('/api/patients/'+ST.cid+'/questionnaires',{questionnaire:type,score,answers});
  if(r&&r.ok){toast(`${score}/${maxScore} ✓`);closeModal();loadQuestionari()}
}

}
function biaLastVal(bia,trend,m){
  if(bia&&bia.length){for(var i=0;i<bia.length;i++){if(bia[i][m]!=null)return bia[i][m]}}
  var arr=trend&&trend.series&&trend.series[m]?trend.series[m]:[];
  for(var j=arr.length-1;j>=0;j--){if(arr[j]!=null)return arr[j]}
  return null;
}
async function loadBIAReading(){
  const cid=+$('bp-cl').value;if(!cid){$('bp-v').innerHTML='<div class=empty>Seleziona un paziente</div>';return}
  const [bia,trend]=await Promise.all([jget('/api/patients/'+cid+'/bia'),jget('/api/patients/'+cid+'/bia-trend')]);
  const labels={weight_kg:'Peso',bf_pct:'BF%',ffm_kg:'Massa magra',tbw_l:'Acqua',pha:'PhA',mm_kg:'Muscolo',bmi:'BMI'};
  const charts=trend.metrics.map(function(m){
    var lv=biaLastVal(bia,trend,m);
    var unit=(m==='weight_kg'||m==='ffm_kg'||m==='tbw_l'||m==='mm_kg')?'kg':(m==='bf_pct'||m==='bmi')?'%':(m==='pha')?'°':'';
    var valHtml = lv!=null ? '<div style="font-size:18px;font-weight:700;margin:2px 0">'+lv+unit+'</div>' : '';
    var svg = trendSVG(trend.dates.map(function(d,i){return {v:trend.series[m][i],d}})) || '<div class=empty style=padding:8px>1 misurazione</div>';
    return '<div class=card style=padding:8px><b style=font-size:11px>'+(labels[m]||m)+'</b>'+valHtml+svg+'</div>';
  }).join('');
  $('bp-v').innerHTML=`<div class=row style=margin-bottom:6px><button class="btn btn-sm btn-outline" onclick="window.open('/api/patients/${cid}/bia-trend/pdf','_blank')">📊 Report PDF</button></div>
  <div style=display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px>${charts}</div>
  <div class=card><b>Storico</b>${bia.length?`<table><tr><th>Data</th><th>Peso</th><th>BF%</th><th>MM%</th><th>PhA</th><th>BMR</th><th></th></tr>
  ${bia.map(r=>`<tr><td>${r.date}</td><td>${r.weight_kg||'—'}</td><td>${r.bf_pct||'—'}</td><td>${r.mm_pct||'—'}</td><td>${r.pha||'—'}</td><td>${r.bmr_kcal||'—'}</td>
  <td><button class="btn btn-sm btn-danger" onclick="deleteBIARow(${r.id},'hub')">✕</button></td></tr>`).join('')}</table>`:'<div class=empty>🔄 Nessuna BIA ancora. Clicca "+ Nuova" per aggiungere la prima misurazione.</div>'}</div>`;
}
function showBIAHubForm(){
  modal(`<div class=card><b>➕ BIA</b><div class=field-row><div><label>Data</label><input id=bfh-d type=date value=${today()}></div>
  <div><label>Peso</label><input id=bfh-w type=number step=0.1></div><div><label>BF%</label><input id=bfh-bf type=number step=0.1></div></div>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveBIAHub()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveBIAHub(){
  const cid=+$('bp-cl').value;if(!cid){toast('Seleziona paziente');return}
  const r=await jpost('/api/patients/'+cid+'/bia',{date:$('bfh-d').value,weight_kg:parseFloat($('bfh-w').value),bf_pct:parseFloat($('bfh-bf').value)});
  if(r&&r.ok){toast('BIA salvata ✓');closeModal();loadBIAReading()}
}
function uploadBIAHub(){
  const cid=+$('bp-cl').value;if(!cid){toast('Seleziona paziente');return}
  const inp=document.createElement('input');inp.type='file';inp.accept='.pdf';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    toast('Estrazione in corso...');
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch(API+'/api/patients/'+cid+'/bia/upload',{method:'POST',body:fd});
      const j=await r.json();
      if(j.ok||j.bia_id){toast('BIA importata ✓');loadBIAReading()}else toast('Errore');
    }catch(e){toast('Errore upload')}
  };inp.click();
}

async function runCompare(){

  const r=await jget('/api/patients/compare?ids='+ids.join(','));
  const fields=['name','weight_kg','bmi','bf_pct','mm_pct','pha','tbw_l','bmr_kcal','ffmi','fmi','whr'];
    const labels=['Nome','Peso','BMI','BF%','MM%','PhA','TBW','BMR','FFMI','FMI','WHR'];
    closeModal();
    modal(`<div class=card><b>⚖️ Confronto</b><table class=cmp-table><tr><th>Metrica</th>${r.map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr>
    ${fields.map((f,i)=>`<tr><td class=metric>${labels[i]}</td>${r.map(x=>`<td>${x[f]??'—'}</td>`).join('')}</tr>`).join('')}<tr><td class=metric>Radar</td>${r.map(x=>`<td><button class="btn btn-sm btn-outline" onclick=showRadar(${x.id})>📊</button></td>`).join('')}</tr></table></div>`);
  }
  function showRadar(pid){
    jget('/api/patients/'+pid+'/radar').then(rd=>{
      const m=rd.metrics||[];
      if(!m.length){toast('Dati insufficienti per radar');return}
      const cx=150,cy=150,r=120,levels=5,tags=m.length,angle=Math.PI*2/tags;
      let svg=`<svg width=320 height=320 viewBox="0 0 300 300" style=max-width:320px>`;
      // Livelli concentrici
      for(let lv=1;lv<=levels;lv++){
        const pr=lv/levels*r;
        let pts='';
        for(let i=0;i<tags;i++){
          const a=-Math.PI/2+angle*i;
          pts+=(i?'L':'M')+(cx+pr*Math.cos(a))+','+(cy+pr*Math.sin(a));
        }
        svg+=`<path d="${pts}Z" fill=none stroke=var(--border) stroke-width=.5/>`;
      }
      // Assi radiali
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        svg+=`<line x1=${cx} y1=${cy} x2=${cx+r*Math.cos(a)} y2=${cy+r*Math.sin(a)} stroke=var(--border) stroke-width=.5/>`;
        const lx=cx+(r+15)*Math.cos(a),ly=cy+(r+15)*Math.sin(a);
        svg+=`<text x=${lx} y=${ly} text-anchor=middle font-size=8 fill=var(--text)>${m[i].label}</text>`;
      }
      // Area dati
      let pts='';
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        const pr=m[i].normalized/100*r;
        pts+=(i?'L':'M')+(cx+pr*Math.cos(a))+','+(cy+pr*Math.sin(a));
      }
      svg+=`<path d="${pts}Z" fill=var(--primary) fill-opacity=.25 stroke=var(--primary) stroke-width=1.5/>`;
      // Punti
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        const pr=m[i].normalized/100*r;
        svg+=`<circle cx=${cx+pr*Math.cos(a)} cy=${cy+pr*Math.sin(a)} r=3 fill=var(--primary)/>`;
      }
      svg+=`</svg><div style=font-size:10px;color:var(--text2);text-align:center>`;
      m.forEach(mm=>{svg+=`<span style=margin:0 6px>${mm.label}: ${mm.value}${mm.unit}</span>`});
      svg+=`</div>`;
      modal(`<div class=card><b>📊 Radar chart — ${rd.patient_name||''}</b>${svg}<button class=btn onclick=closeModal()>Chiudi</button></div>`);
    });
  }

// SVG TREND HELPER
function trendSVG(values){
  if(!values||values.length<2)return '';
  const w=Math.max(values.length*40,200),h=80,pad=10;
  const vs=values.map(v=>v.v); const min=Math.min(...vs)-2; const max=Math.max(...vs)+2; const rng=max-min||1;
  const pts=vs.map((v,i)=>`${pad+(i/(vs.length-1))*(w-2*pad)},${h-((v-min)/rng)*(h-20)-10}`);
  return `<svg viewBox="0 0 ${w} ${h}" width=100% height=${h} style=margin:6px 0>
  <polyline points="${pts.join(' ')}" fill=none stroke=var(--primary) stroke-width=2 stroke-linejoin=round/>
  ${pts.map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r=3 fill=var(--primary)/>`).join('')}
  <text x=${pad} y=${h-2} font-size=8 fill=var(--text2)>${Math.round(min)}</text>
  <text x=${w-20} y=${h-2} font-size=8 fill=var(--text2)>${Math.round(max)}</text>
  </svg>`;
}

function startOnboarding(){
  if(localStorage.getItem('onboarding_done'))return;
  const steps=[
    {icon:'👋',title:'Benvenuto in NutriCoach!',text:'Da qui gestisci i tuoi pazienti, crei piani alimentari e monitori i progressi.'},
    {icon:'📋',title:'Piani alimentari personalizzati',text:'Crea un piano alimentare personalizzato con pochi click - scegli cibi, porzioni e obiettivi.'},
    {icon:'📊',title:'Monitoraggio e report',text:'Monitora i progressi con grafici, trend e report dettagliati per ogni paziente.'}
  ];
  let step=0;
  function render(){
    const s=steps[step];
    const isLast=step===steps.length-1;
    // Use array join to avoid nested template literals
    var dots='';
    for(var j=0;j<steps.length;j++){dots+='<div class="onboarding-step'+(j===step?' active':'')+'"></div>'}
    $('onboarding-overlay').innerHTML='<div class=onboarding-card>'+
      '<div style=font-size:48px;margin-bottom:8px>'+esc(s.icon)+'</div>'+
      '<h2>'+esc(s.title)+'</h2>'+
      '<p>'+esc(s.text)+'</p>'+
      '<div class=onboarding-steps>'+dots+'</div>'+
      '<div class=onboarding-btns>'+
        '<button class="btn btn-skip" onclick=endOnboarding()>Salta</button>'+
        (isLast?'<button class="btn btn-finish" onclick=endOnboarding()>Fine</button>'
               :'<button class="btn btn-next" onclick=nextStep()>Avanti →</button>')+
      '</div></div>';
  }
  window.nextStep=function(){step++;render()};
  window.endOnboarding=function(){localStorage.setItem('onboarding_done','1');$('onboarding-overlay').style.display='none';$('onboarding-overlay').innerHTML=''};
  const overlay=document.createElement('div');overlay.id='onboarding-overlay';
  document.body.appendChild(overlay);render();
}

    <div class=row><div>👥 Pazienti: <b>${s.total_patients}</b></div><div>${genHtml}</div><div>📅 Età media: <b>${s.avg_age!=null?s.avg_age:'—'}</b></div></div>
    <hr style=margin:6px 0>${catHtml}
    ${bia.avg_weight?`<hr style=margin:6px 0><div style=font-size:10px>⚖️ BIA medio: ${Number(bia.avg_weight).toFixed(1)}kg, BMI ${Number(bia.avg_bmi).toFixed(1)}, BF ${Number(bia.avg_bf).toFixed(1)}%, TBW ${Number(bia.avg_tbw).toFixed(1)}L</div>`:''}
    <div style=margin-top:8px><button class=btn onclick=closeModal()>Chiudi</button></div></div>`);
}
