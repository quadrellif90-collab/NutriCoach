<!DOCTYPE html><html lang=it><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>NutriCoach v2</title>
<link rel=stylesheet href=/static/style.css>
</head><body>
<div class=sidebar>
  <div class=logo>🥗 <span>NutriCoach</span></div>
  <div class="nav-item active" data-nav=dashboard onclick="nav('dashboard')"><span class=ico>📊</span><span>Dashboard</span></div>
  <div class=nav-item data-nav=pazienti onclick="nav('pazienti')"><span class=ico>👥</span><span>Pazienti</span></div>
  <div class=nav-item data-nav=bia onclick="nav('bia')"><span class=ico>🔬</span><span>BIA</span></div>
  <div class=nav-item data-nav=dieta onclick="nav('dieta')"><span class=ico>🍽️</span><span>Dieta</span></div>
  <div class=nav-item data-nav=agenda onclick="nav('agenda')"><span class=ico>📅</span><span>Agenda</span></div>
  <div class=nav-item data-nav=notifiche onclick="nav('notifiche')"><span class=ico>📨</span><span>Notifiche</span></div>
  <div class=nav-item data-nav=archivio onclick="nav('archivio')"><span class=ico>📁</span><span>Archivio</span></div>
  <div class=nav-item data-nav=ricettario onclick="nav('ricettario')"><span class=ico>📖</span><span>Ricettario</span></div>
  <div class=spacer></div>
  <button class="btn btn-sm btn-outline" onclick=toggleTheme() id=theme-btn>🌙</button>
  <div class=version>v2.12.0 · Dietowin</div>
</div>
<div class=main>
  <div class=topbar>
    <h1 id=page-title>Dashboard</h1>
    <input id=search-input placeholder="Cerca paziente..." oninput=onSearch(this.value)>
    <button class=btn onclick="nav('pazienti')">+ Nuovo</button>
  </div>
  <div id=view></div>
</div>
<div id=modal-root></div>
<div id=toast></div>
<script>
const API=''; let ST={nav:'dashboard',clients:[],cid:null,cats:[],name:null,weight:null};
function $(id){return document.getElementById(id)}
function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function jget(u){return fetch(API+u).then(r=>r.json())}
function jpost(u,b){return fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())}
function jdel(u){return fetch(API+u,{method:'DELETE'}).then(r=>r.json())}
function esc(s){return s==null?'':String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function init(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function clr(){const c=['#6366f1','#0d9488','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];return c[Math.floor(Math.random()*c.length)]}
// NAVIGATION
async function nav(n){
  ST.nav=n;
  qsa('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.nav===n));
  $('page-title').textContent={'dashboard':'Dashboard','pazienti':'Pazienti','bia':'BIA & Misure','dieta':'Dieta','agenda':'Agenda','notifiche':'Notifiche','archivio':'Archivio','ricettario':'Ricettario'}[n]||n;
  if(n==='dashboard')await loadDashboard();
  else if(n==='pazienti')await loadPazienti();
  else if(n==='bia')await loadBIA();
  else if(n==='dieta')loadDieta();
  else if(n==='agenda')loadAgenda();
  else if(n==='notifiche')loadNotifiche();
  else if(n==='archivio')loadArchivio();
  else if(n==='ricettario')loadRicettario();
}
// THEME TOGGLE
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('nc-theme',next);
  $('theme-btn').textContent=next==='dark'?'☀️':'🌙';
}
(function(){const t=localStorage.getItem('nc-theme');if(t){document.documentElement.setAttribute('data-theme',t);const b=$('theme-btn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}})();
// RICETTARIO
async function loadRicettario(q){
  const qp=q||'';
  const r=await jget('/api/recipes?q='+encodeURIComponent(qp));
  const rc=r.recipes||[];
  $('view').innerHTML=`<div class=row style=margin:8px 0>
    <input id=rq placeholder="Cerca ricetta..." value="${esc(qp)}" oninput="loadRicettario(this.value)" style=flex:1>
    <button class=btn onclick=showAddRecipe()>➕ Nuova ricetta</button>
  </div>
  ${rc.length?rc.map(r=>`<div class=card><div style=display:flex;justify-content:space-between;align-items:center>
    <b>${esc(r.name)}</b>
    <div><span class=tag>${esc(r.category||'—')}</span> <span style=font-size:10px;color:var(--text2)>${r.servings||4} porz.</span></div>
  </div>
  <div style=font-size:10px;color:var(--text2);margin:2px 0>${(r.ingredients||[]).map(i=>i.name||'?').join(', ')}</div>
  <div style=font-size:10px;margin:2px 0>${r.macros?`📊 ${r.macros.kcal||'?'}kcal · P${r.macros.protein_g||'?'}g · C${r.macros.carbs_g||'?'}g · F${r.macros.fat_g||'?'}g`:'📊 —'}</div>
  <div style=margin-top:4px;display:flex;gap:4px>
    <button class="btn btn-sm btn-outline" onclick="applyRecipe(${r.id},'${esc(r.name)}')">➕ Al piano</button>
    <button class="btn btn-sm btn-danger" onclick="delRecipe(${r.id})">✕</button>
  </div></div>`).join(''):'<div class=card empty>Nessuna ricetta. Creane una!</div>'}`;
}
function showAddRecipe(){
  modal(`<div class=card><b>📖 Nuova ricetta</b>
  <label>Nome</label><input id=rn>
  <label>Categoria</label><select id=rc><option value=antipasti>Antipasti</option><option value=primi>Primi</option><option value=secondi selected>Secondi</option><option value=contorni>Contorni</option><option value=dolci>Dolci</option></select>
  <label>Porzioni</label><input id=rs type=number value=4>
  <label>Ingredienti (food_id:grammi, separati da virgola)</label><textarea id=ri rows=3 placeholder="es. 1:200, 29:150, 45:100"></textarea>
  <div style=font-size:10px;color:var(--text2)>Usa ID alimento (es. 1=petto pollo, 29=pasta, ecc.)</div>
  <label>Istruzioni</label><textarea id=rt rows=3></textarea>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveRecipe()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveRecipe(){
  const name=$('rn').value; if(!name){toast('Inserisci nome');return}
  const ingText=$('ri').value;
  const ingredients=[];
  if(ingText){
    ingText.split(',').forEach(p=>{
      const parts=p.trim().split(':');
      if(parts.length===2) ingredients.push({food_id:parseInt(parts[0]),name:'',grams:parseFloat(parts[1])||100});
    });
  }
  await jpost('/api/recipes',{
    name, category:$('rc').value, servings:parseInt($('rs').value)||4,
    ingredients, instructions:$('rt').value
  });
  toast('Ricetta salvata ✓');closeModal();loadRicettario();
}
async function delRecipe(rid){
  if(!confirm('Eliminare questa ricetta?'))return;
  await jdel('/api/recipes/'+rid);
  toast('Ricetta eliminata');loadRicettario();
}
async function applyRecipe(rid,rname){
  if(!ST.cid){toast('Apri prima un paziente');return}
  if(!confirm(`Applicare "${rname}" al paziente corrente?`))return;
  const day=prompt('Giorno (lun/mar/mer/...):','lun')||'lun';
  const meal=prompt('Past (colazione/pranzo/cena/...):','pranzo')||'pranzo';
  const r=await jpost('/api/recipes/'+rid+'/apply',{patient_id:ST.cid,day,meal});
  if(r&&r.ok)toast(`Ricetta applicata (${r.items_added} ingredienti) ✓`);
  else toast('Errore');
}
// DASHBOARD
async function loadDashboard(){
  const cls=await jget('/api/patients');
  ST.clients=cls; const n=cls.length;
  $('view').innerHTML=`<div class=row style=margin-bottom:12px>
    <div class=card style=flex:1;text-align:center><b>${n}</b><div class=meta>Pazienti</div></div>
    <div class=card style=flex:1;text-align:center><b>${cls.filter(c=>c.goal).length}</b><div class=meta>Con obiettivo</div></div>
    <div class=card style=flex:1;text-align:center><b>0</b><div class=meta>App. oggi</div></div>
  </div>
  <div class=card><b>👥 Ultimi pazienti</b>
  ${cls.slice(0,5).map(c=>`<div class=patient-card onclick="openPatient(${c.id})"><div class=init style=background:${clr()}>${init(c.name)}</div><div class=info><b>${esc(c.name)}</b><div class=meta>${c.goal||'—'} · ${c.sport||''}</div></div></div>`).join('')||'<div class=empty>Nessun paziente</div>'}</div>
  <div class=card id=dash-trends style=max-height:180px;overflow:auto><b>📈 Trend ultime letture</b><div style=font-size:10px;color:var(--text2) id=dash-trend-content>Caricamento...</div></div>
  <div class=row style=margin-top:12px>
    <button class="btn btn-sm btn-outline" onclick="doBackup()">💾 Backup ora</button>
    <button class="btn btn-sm btn-outline" onclick="exportPatients()">📤 Export CSV</button>
  </div>`;
  // Carica trend per i primi 3 pazienti
  Promise.all(cls.slice(0,3).map(c=>jget('/api/patients/'+c.id+'/bia-trend').then(r=>{if(r&&r.length>1){return {name:c.name,trend:r}}return null}).catch(()=>null))).then(trends=>{
    const t=trends.filter(Boolean);
    $('dash-trend-content').innerHTML=t.length?t.map(p=>`<div style=margin:2px 0><b>${esc(p.name)}</b> ${trendSVG(p.trend.slice(-6).map(x=>({v:x.weight_kg})))}</div>`).join(''):'<span>Nessun trend disponibile</span>';
  });
}
async function showAdherence(pid){
  const r=await jget('/api/patients/'+pid+'/adherence');
  const ad=r.adherence||[];
  if(!ad.length){toast('Nessun piano attivo');return}
  modal(`<div class=card><b>📊 Aderenza dieta</b><table class=cmp-table><tr><th>Giorno</th><th>Target</th><th>Effettivo</th><th>%</th></tr>
  ${ad.map(d=>`<tr><td>${d.label}</td><td>${d.target_kcal} kcal</td><td>${d.actual_kcal} kcal</td><td><b>${d.completion_pct}%</b></td></tr>`).join('')}</table>
  <div style=margin-top:8px><button class=btn onclick=closeModal()>Chiudi</button></div></div>`);
}
async function doBackup(){
  toast('Backup in corso...');
  const r=await jpost('/api/backup',{});
  if(r&&r.ok)toast('Backup creato ✓ '+r.timestamp);else toast('Errore backup');
}
async function exportPatients(){
  window.open('/api/export/patients','_blank');
}
// PAZIENTI LIST
async function loadPazienti(){
  const cls=await jget('/api/patients');
  ST.clients=cls;
  $('view').innerHTML=`<div class=row style=margin-bottom:8px>
    <button class="btn btn-primary" onclick=showNewPatient()>➕ Nuovo paziente</button>
    <button class="btn btn-outline" onclick=showCompare()>⚖️ Confronta</button>
    <span class=meta>${cls.length} pazienti</span>
  </div>
  ${cls.map(c=>`<div class=patient-card onclick="openPatient(${c.id})"><div class=init style=background:${clr()}>${init(c.name)}</div>
    <div class=info><b>${esc(c.name)}</b><div class=meta>${c.goal||'—'} · ${c.sport||''}</div></div>
  </div>`).join('')||'<div class=card><div class=empty>Clicca "+ Nuovo paziente" per iniziare</div></div>'}`;
}
function onSearch(q){
  const m=ST.clients.find(c=>c.name&&c.name.toLowerCase().includes(q.toLowerCase()));
  if(m)openPatient(m.id);
  else if(q.length>1)toast('Nessun paziente trovato');
}
// NEW PATIENT
function showNewPatient(){
  modal(`<div class=card><b>➕ Nuovo paziente</b>
  <div class=field-row><div><label>Nome *</label><input id=np-name></div><div><label>Sesso</label><select id=np-sex><option value=M>M</option><option value=F>F</option></select></div></div>
  <div class=field-row><div><label>Telefono</label><input id=np-phone></div><div><label>Email</label><input id=np-email type=email></div></div>
  <div class=field-row><div><label>Obiettivo</label><input id=np-goal></div><div><label>Sport</label><input id=np-sport></div></div>
  <div style=margin-top:10px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveNewPatient()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveNewPatient(){
  const b={name:$('np-name').value,sex:$('np-sex').value,phone:$('np-phone').value,email:$('np-email').value,goal:$('np-goal').value,sport:$('np-sport').value};
  if(!b.name){toast('Inserisci il nome');return}
  const r=await jpost('/api/patients',b);
  if(r&&r.ok){toast('Paziente creato ✓');closeModal();nav('pazienti')}else toast('Errore');
}
// OPEN PATIENT
async function openPatient(cid){
  ST.cid=cid;
  const c=await jget('/api/patients/'+cid);
  ST.name=c.name; ST.weight=c.weight_kg||null;
  $('page-title').textContent=esc(c.name);
  $('view').innerHTML=`<div class=card><div class=row><div style=width:40px;height:40px;border-radius:50%;background:${clr()};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700>${init(c.name)}</div>
    <div style=flex:1><b>${esc(c.name)}</b><div class=meta>${c.sex||'?'} · ${c.goal||'—'} · ${c.sport||'—'}</div></div>
  ${c.phone?`<button class="btn btn-sm btn-outline" onclick="window.open('https://wa.me/${c.phone.replace(/[^0-9]/g,'')}','_blank')">💬</button>`:''}
  <button class="btn btn-sm btn-danger" onclick=deletePatient(${c.id})>✕</button>
  <button class="btn btn-sm btn-outline" onclick=genPortal()>🔗 Portale</button></div></div>
  <div class=tab-bar id=ptabs>
    <button class="tab-btn active" onclick=switchTab(this,'anamnesi')>Anamnesi</button>
    <button class=tab-btn onclick=switchTab(this,'bia')>BIA</button>
    <button class=tab-btn onclick=switchTab(this,'misure')>Misure</button>
    <button class=tab-btn onclick=switchTab(this,'dieta')>Dieta</button>
    <button class=tab-btn onclick=switchTab(this,'referti')>Referti</button>
    <button class=tab-btn onclick=switchTab(this,'appuntamenti')>Appuntamenti</button>
    <button class=tab-btn onclick=switchTab(this,'sintomi')>Sintomi</button>
    <button class=tab-btn onclick=switchTab(this,'progressi')>Progressi</button>
  </div>
  <div id=patient-pane></div>`;
  switchTab(qs('#ptabs .tab-btn'),'anamnesi');
}
function returnToDashboard(){
  if(ST.cid&&confirm('Tornare alla dashboard? I dati non salvati andranno persi.')){ST.cid=null;nav('dashboard')}
}
async function deletePatient(cid){
  if(!confirm('Eliminare questo paziente e tutti i suoi dati?'))return;
  await jdel('/api/patients/'+cid);
  toast('Paziente eliminato');
  if(ST.cid===cid)nav('pazienti'); else nav('pazienti');
}
async function genPortal(){
  const r=await jpost('/api/patients/'+ST.cid+'/portal-token',{});
  if(r&&r.url){
    const full=location.origin+r.url;
    navigator.clipboard?.writeText(full).then(()=>toast('Link copiato ✓'));
    modal(`<div class=card><b>🔗 Portale paziente</b><div style=font-size:11px;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;margin:6px 0>${full}</div><button class="btn btn-primary" onclick="window.open('${r.url}','_blank')">🌐 Apri portale</button></div>`);
  } else toast('Errore');
}
// PATIENT TABS
function switchTab(el,tab){
  qsa('#ptabs .tab-btn').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
  const p=$('patient-pane');
  if(tab==='anamnesi')loadAnamnesi();
  else if(tab==='bia')loadPatientBIA();
  else if(tab==='misure')loadMisure();
  else if(tab==='dieta')loadPatientDieta();
  else if(tab==='referti')loadReferti();
  else if(tab==='appuntamenti')loadAppuntamenti();
  else if(tab==='sintomi')loadSintomi();
  else if(tab==='progressi')loadProgressi();
}
async function loadAnamnesi(){
  let a={}; try{a=await jget('/api/patients/'+ST.cid+'/anamnesis')}catch(e){}
  const conds=(a.conditions||[]).join(', ')||'—';
  $('patient-pane').innerHTML=`<div class=row style=margin-bottom:8px><b>🩺 Anamnesi</b><button class="btn btn-sm" onclick=showAnamnesiForm()>✏️ Modifica</button></div>
  <div class=card><b>Condizioni cliniche</b><br>${esc(conds)}</div>
  <div class=card><b>Note</b><br>${esc(a.notes||'—')}</div>
  ${a.recommendations?`<div class=card><b>🎯 Raccomandazioni</b>${(Array.isArray(a.recommendations)?a.recommendations:[]).slice(0,3).map(r=>`<div style=margin:4px 0;padding:6px;background:#f0fdf4;border-radius:4px;font-size:11px>${esc(typeof r==='string'?r:r.condition||'')}</div>`).join('')}</div>`:''}`;
}
async function showAnamnesiForm(){
  let a={}; try{a=await jget('/api/patients/'+ST.cid+'/anamnesis')}catch(e){}
  const sel=a.conditions||[];
  const cl=await jget('/api/clinical-conditions');
  const all=cl.conditions||{};
  const html=Object.keys(all).map(k=>`<label class=chk style=font-size:11px><input type=checkbox class=ac value=${k} ${sel.includes(k)?'checked':''}>${all[k].name||k}</label>`).join('');
  modal(`<div class=card><b>✏️ Anamnesi</b><label>Condizioni cliniche</label><div style=display:flex;flex-wrap:wrap;gap:4px;max-height:180px;overflow:auto;margin-bottom:6px>${html}</div><label>Note</label><textarea id=an-notes rows=3>${esc(a.notes||'')}</textarea>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveAnamnesi()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveAnamnesi(){
  const conds=Array.from(qsa('.ac:checked')).map(c=>c.value);
  const notes=$('an-notes').value;
  const r=await jpost('/api/patients/'+ST.cid+'/anamnesis',{conditions:conds,notes});
  if(r&&r.ok){toast('Anamnesi salvata ✓');closeModal();loadAnamnesi()}else toast('Errore');
}
// PATIENT BIA
async function loadPatientBIA(){
  const bia=await jget('/api/patients/'+ST.cid+'/bia');
  const trend=await jget('/api/patients/'+ST.cid+'/bia-trend?field=weight_kg&days=365');
  $('patient-pane').innerHTML=`<div class=row style=margin-bottom:8px><b>📊 Misurazioni BIA</b><button class="btn btn-sm" onclick=showBIAForm()>➕ Nuova</button></div>
  ${trend.length>1?`<div class=card>${trendSVG(trend.map(t=>({v:t.weight_kg,d:t.date})))}
  <div style=font-size:11px;color:var(--text2)>${trend[0].weight_kg} → ${trend[trend.length-1].weight_kg} kg</div></div>`:''}
  <div class=card><b>Storico</b>${bia.length?`<table><tr><th>Data</th><th>Peso</th><th>BF%</th><th>MM%</th><th>PhA</th><th>TBW</th><th>BMR</th><th></th></tr>
  ${bia.map(r=>`<tr><td>${r.date}</td><td>${r.weight_kg||'—'}</td><td>${r.bf_pct||'—'}</td><td>${r.mm_pct||'—'}</td><td>${r.pha||'—'}</td><td>${r.tbw_l||'—'}</td><td>${r.bmr_kcal||'—'}</td>
  <td><button class="btn btn-sm btn-danger" onclick="if(confirm('Eliminare?')){jdel('/api/bia/${r.id}').then(()=>loadPatientBIA())}">✕</button></td></tr>`).join('')}</table>`:'<div class=empty>Nessuna BIA</div>'}</div>`;
}
function showBIAForm(){
  modal(`<div class=card><b>➕ Nuova BIA</b><div class=field-row><div><label>Data</label><input id=bf-date type=date value=${today()}>
  </div><div><label>Peso (kg)</label><input id=bf-w type=number step=0.1></div><div><label>BF%</label><input id=bf-bf type=number step=0.1></div></div>
  <div class=field-row><div><label>MM%</label><input id=bf-mm type=number step=0.1></div><div><label>PhA</label><input id=bf-pha type=number step=0.1></div>
  <div><label>TBW (L)</label><input id=bf-tbw type=number step=0.1></div><div><label>BMR</label><input id=bf-bmr type=number></div></div>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveBIA()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveBIA(){
  const fields={weight_kg:parseFloat($('bf-w').value),bf_pct:parseFloat($('bf-bf').value),mm_pct:parseFloat($('bf-mm').value),pha:parseFloat($('bf-pha').value),tbw_l:parseFloat($('bf-tbw').value),bmr_kcal:parseFloat($('bf-bmr').value),date:$('bf-date').value};
  const r=await jpost('/api/patients/'+ST.cid+'/bia',fields);
  if(r&&r.ok){toast('BIA salvata ✓');closeModal();loadPatientBIA()}else toast('Errore');
}
// PATIENT DIET
async function loadPatientDieta(){
  const items=await jget('/api/patients/'+ST.cid+'/diet-items');
  const days=['lun','mar','mer','gio','ven','sab','dom'];
  const dayNames={'lun':'LUN','mar':'MAR','mer':'MER','gio':'GIO','ven':'VEN','sab':'SAB','dom':'DOM'};
  const byDay={}; days.forEach(d=>{byDay[d]=[]});
  items.forEach(i=>{if(byDay[i.day])byDay[i.day].push(i)});
  // Carica macro per ogni giorno
  const macros={};
  await Promise.all(days.map(async d=>{
    try{macros[d]=await jget('/api/patients/'+ST.cid+'/diet-macros/'+d)}catch(e){}
  }));

async function calcEnergy(){
  try{
    const act=$('gp-act').value, goal=$('gp-goal').value;
    const e=await jget('/api/patients/'+ST.cid+'/energy-needs?activity='+act+'&goal='+goal);
    if(e&&e.target_kcal){
      $('gp-k').value=e.target_kcal;
      const bmrs=Object.entries(e.bmr).map(([k,v])=>k+': '+v).join(' · ');
      $('gp-energy').innerHTML=`🔥 BMR [${bmrs}] → TDEE ${e.tdee} kcal → <b>Target ${e.target_kcal} kcal</b> (${e.goal_adjustment_pct>0?'+':''}${e.goal_adjustment_pct}%)${e.protein_g_range?' · Proteine '+e.protein_g_range[0]+'-'+e.protein_g_range[1]+'g':''}`;
      toast('Fabbisogno calcolato ✓');
    } else {$('gp-energy').textContent=e.error||'Errore calcolo';toast('Servono dati BIA')}
  }catch(err){toast('Inserire prima una BIA con peso')}
}
function onPresetChange(){
  const key=$('gp-preset').value; if(!key)return;
  const kcal=parseFloat($('gp-k').value)||2000;
  jpost('/api/diet-presets/targets',{key,kcal,weight_kg:ST.weight||null}).then(t=>{
    if(t&&t.p_pct!=null){$('gp-p').value=t.p_pct;$('gp-c').value=t.c_pct;$('gp-f').value=t.f_pct;toast('Preset: '+key)}
  });
}
async function genPlan(){
  const pre=$('gp-preset')?$('gp-preset').value:'';
  const targets={kcal:parseFloat($('gp-k').value),protein_pct:parseFloat($('gp-p').value),carb_pct:parseFloat($('gp-c').value),fat_pct:parseFloat($('gp-f').value)};
  const conds=Array.from(qsa('#gp-cd input:checked')).map(c=>c.value);
  const opts={meals:parseInt($('gp-fr').value),days:['lun','mar','mer','gio','ven','sab','dom'],conditions:conds,preset:pre};
  closeModal();toast('Generazione...');
  const pl=await jpost('/api/patients/'+ST.cid+'/plan/generate',{targets,options:opts,preset:pre});
  if(pl&&pl.days){
    // apply plan items
    await jpost('/api/patients/'+ST.cid+'/diet/clear');
    for(const d of pl.days){
      const dk=(d.day||'').slice(0,3).toLowerCase();
      if(!d.meals)continue;
      for(const mp of d.meals){
        const mk=mp.meal||'';
        for(const f of (mp.items||[])){
          if(f&&f.food)await jpost('/api/patients/'+ST.cid+'/diet-items',{day:dk,meal:mk,food:f.food,grams:f.g||0});
        }
      }
    }
    toast('Piano generato ✓');loadPatientDieta()
  } else toast('Errore');
}

  ${n.length?`<div class=card><table><tr><th>Paziente</th><th>Tipo</th><th>Oggetto</th><th>Inviata</th></tr>${n.map(x=>`<tr><td>${esc(x.patient_name||'')}</td><td>${x.type}</td><td>${esc(x.subject)}</td><td>${x.sent?'✓':'-'}</td></tr>`).join('')}</table></div>`:'<div class=empty>Nessuna notifica</div>'}`;
}
function showNotificaForm(){
  modal(`<div class=card><b>➕ Notifica</b><div class=field-row><div style=flex:2><label>Paziente</label><select id=n-p><option value=>Seleziona...</option>${ST.clients.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select></div>
  <div><label>Tipo</label><select id=n-t><option value=email>Email</option><option value=whatsapp>WhatsApp</option></select></div></div>
  <div class=field-row><div style=flex:2><label>Oggetto</label><input id=n-s></div></div><label>Messaggio</label><textarea id=n-m rows=3></textarea>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=saveNotifica()>💾 Salva</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function saveNotifica(){

  if(r&&r.ok){toast('Creata ✓');closeModal();loadNotifiche()}
}

// COMPARE
function showCompare(){
  const cls=ST.clients;
  modal(`<div class=card><b>⚖️ Confronta pazienti</b><div style=max-height:250px;overflow:auto>${cls.map(c=>`<label class=chk><input type=checkbox class=cp value=${c.id}>${esc(c.name)}</label>`).join('')}</div>
  <div style=margin-top:8px;display:flex;gap:8px><button class="btn btn-primary" onclick=runCompare()>📊 Confronta</button><button class=btn onclick=closeModal()>Annulla</button></div></div>`);
}
async function runCompare(){
  const ids=Array.from(qsa('.cp:checked')).map(c=>c.value);
  if(ids.length<2){toast('Seleziona 2+ pazienti');return}
  const r=await jget('/api/patients/compare?ids='+ids.join(','));
  const fields=['name','weight_kg','bmi','bf_pct','mm_pct','pha','tbw_l','bmr_kcal','ffmi','fmi','whr'];
    const labels=['Nome','Peso','BMI','BF%','MM%','PhA','TBW','BMR','FFMI','FMI','WHR'];
    closeModal();
    modal(`<div class=card><b>⚖️ Confronto</b><table class=cmp-table><tr><th>Metrica</th>${r.map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr>
    ${fields.map((f,i)=>`<tr><td class=metric>${labels[i]}</td>${r.map(x=>`<td>${x[f]??'—'}</td>`).join('')}</tr>`).join('')}<tr><td class=metric>Radar</td>${r.map(x=>`<td><button class="btn btn-sm btn-outline" onclick=showRadar(${x.id})>📊</button></td>`).join('')}</tr></table></div>`);
  }
  function showRadar(pid){
    jget('/api/patients/'+pid+'/radar').then(rd=>{
      const m=rd.metrics||[];
      if(!m.length){toast('Dati insufficienti per radar');return}
      const cx=150,cy=150,r=120,levels=5,tags=m.length,angle=Math.PI*2/tags;
      let svg=`<svg width=320 height=320 viewBox="0 0 300 300" style=max-width:320px>`;
      // Livelli concentrici
      for(let lv=1;lv<=levels;lv++){
        const pr=lv/levels*r;
        let pts='';
        for(let i=0;i<tags;i++){
          const a=-Math.PI/2+angle*i;
          pts+=(i?'L':'M')+(cx+pr*Math.cos(a))+','+(cy+pr*Math.sin(a));
        }
        svg+=`<path d="${pts}Z" fill=none stroke=var(--border) stroke-width=.5/>`;
      }
      // Assi radiali
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        svg+=`<line x1=${cx} y1=${cy} x2=${cx+r*Math.cos(a)} y2=${cy+r*Math.sin(a)} stroke=var(--border) stroke-width=.5/>`;
        const lx=cx+(r+15)*Math.cos(a),ly=cy+(r+15)*Math.sin(a);
        svg+=`<text x=${lx} y=${ly} text-anchor=middle font-size=8 fill=var(--text)>${m[i].label}</text>`;
      }
      // Area dati
      let pts='';
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        const pr=m[i].normalized/100*r;
        pts+=(i?'L':'M')+(cx+pr*Math.cos(a))+','+(cy+pr*Math.sin(a));
      }
      svg+=`<path d="${pts}Z" fill=var(--primary) fill-opacity=.25 stroke=var(--primary) stroke-width=1.5/>`;
      // Punti
      for(let i=0;i<tags;i++){
        const a=-Math.PI/2+angle*i;
        const pr=m[i].normalized/100*r;
        svg+=`<circle cx=${cx+pr*Math.cos(a)} cy=${cy+pr*Math.sin(a)} r=3 fill=var(--primary)/>`;
      }
      svg+=`</svg><div style=font-size:10px;color:var(--text2);text-align:center>`;
      m.forEach(mm=>{svg+=`<span style=margin:0 6px>${mm.label}: ${mm.value}${mm.unit}</span>`});
      svg+=`</div>`;
      modal(`<div class=card><b>📊 Radar chart — ${rd.patient_name||''}</b>${svg}<button class=btn onclick=closeModal()>Chiudi</button></div>`);
    });
  }
}
// SVG TREND HELPER
function trendSVG(values){
  if(!values||values.length<2)return '';
  const w=Math.max(values.length*40,200),h=80,pad=10;
  const vs=values.map(v=>v.v); const min=Math.min(...vs)-2; const max=Math.max(...vs)+2; const rng=max-min||1;
  const pts=vs.map((v,i)=>`${pad+(i/(vs.length-1))*(w-2*pad)},${h-((v-min)/rng)*(h-20)-10}`);
  return `<svg viewBox="0 0 ${w} ${h}" width=100% height=${h} style=margin:6px 0>
  <polyline points="${pts.join(' ')}" fill=none stroke=var(--primary) stroke-width=2 stroke-linejoin=round/>
  ${pts.map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r=3 fill=var(--primary)/>`).join('')}
  <text x=${pad} y=${h-2} font-size=8 fill=var(--text2)>${Math.round(min)}</text>
  <text x=${w-20} y=${h-2} font-size=8 fill=var(--text2)>${Math.round(max)}</text>
  </svg>`;
}
// MODAL
function modal(body){
  $('modal-root').innerHTML=`<div class=modal-overlay onclick="if(event.target===this)closeModal()"><div class=modal><div class=modal-head><span>NutriCoach</span><button class=btn onclick=closeModal() style=border:none;padding:2px 6px>✕</button></div><div class=modal-body>${body}</div></div></div>`;
}
function closeModal(){$('modal-root').innerHTML=''}
