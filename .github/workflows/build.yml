name: Build NutriCoach (Windows + macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (exe + installer NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract (bundled OCR)
        run: choco install tesseract --no-progress -y

      - name: Copy Tesseract into repo (for PyInstaller bundle)
        shell: pwsh
        run: |
          $src = (Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter tesseract.exe -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          if (-not $src) { throw "tesseract.exe non trovato" }
          $dst = "tesseract"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse
          echo "Copiato Tesseract da $src -> $dst"
          ls $dst

      - name: Build executable (one-file)
        run: pyinstaller NutriCoach.spec --noconfirm --clean

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer (NutriCoach-Setup-<ver>.exe)
        shell: pwsh
        run: |
          $makensis = (Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $makensis) { throw "makensis non trovato" }
          & $makensis /DVERSION=${{ github.ref_name }} installer.nsi

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriCoach-Windows-exe
          path: dist/NutriCoach.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriCoach-Windows-setup
          path: NutriCoach-Setup-*.exe

  build-macos:
    name: Build macOS (app + dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract (bundled OCR)
        run: brew install tesseract

      - name: Copy Tesseract into repo (for PyInstaller bundle)
        run: |
          SRC=$(brew --prefix tesseract)
          rm -rf tesseract
          mkdir -p tesseract
          cp "$SRC/bin/tesseract" tesseract/
          cp -R "$SRC/share/tessdata" tesseract/tessdata
          echo "Copiato Tesseract da $SRC"
          ls -R tesseract | head -20

      - name: Build executable (one-file)
        run: pyinstaller NutriCoach.spec --noconfirm --clean

      - name: Prepare .app bundle
        run: |
          APP_DIR="dist/NutriCoach.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp dist/NutriCoach "$APP_DIR/Contents/MacOS/NutriCoach"
          chmod +x "$APP_DIR/Contents/MacOS/NutriCoach"
          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>NutriCoach</string>
            <key>CFBundleDisplayName</key><string>NutriCoach</string>
            <key>CFBundleIdentifier</key><string>com.nutricoach.app</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key><string>NutriCoach</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

      - name: Build .dmg
        run: |
          hdiutil create -volname "NutriCoach" -srcfolder dist/NutriCoach.app -ov -format UDZO "dist/NutriCoach-${{ github.ref_name }}.dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriCoach-macOS-dmg
          path: dist/NutriCoach-*.dmg

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NutriCoach ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## NutriCoach ${{ github.ref_name }}

            Gestionale nutrizione **100% locale** per nutrizionisti. Nessun cloud, nessun account remoto.

            ### Download
            - **Windows (installer)**: `NutriCoach-Setup-${{ github.ref_name }}.exe` — doppio click, installa in Program Files + scorciatoie.
            - **Windows (solo exe)**: `NutriCoach.exe` — portatile, estrai e avvia.
            - **macOS (dmg)**: `NutriCoach-${{ github.ref_name }}.dmg` — apri, trascina `NutriCoach.app` in Applicazioni.

            Al primo avvio imposta il tuo account nutrizionista (username + password).
            I dati restano nel tuo computer (`~/.nutricoach/` su entrambi i sistemi).

            > **macOS**: l'app non è firmata/notarizzata da Apple. Al primo avvio, se compare
            > "app non può essere aperta", fai click destro → **Apri**, oppure da Terminale:
            > `xattr -dr com.apple.quarantine /Applications/NutriCoach.app`
          files: |
            artifacts/NutriCoach-Windows-setup/NutriCoach-Setup-*.exe
            artifacts/NutriCoach-Windows-exe/NutriCoach.exe
            artifacts/NutriCoach-macOS-dmg/NutriCoach-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
