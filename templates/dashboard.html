<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriCoach</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f0f3f9; --border:#e2e8f0;
  --text:#1a2233; --muted:#64748b; --accent:#16a34a; --accent2:#0ea5e9; --accent3:#8b5cf6;
  --amber:#f59e0b; --danger:#ef4444; --ok:#16a34a;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--accent2);text-decoration:none}
button{font-family:inherit}
/* ---- layout ---- */
.app{display:flex;min-height:100vh}
.sidebar{width:226px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:700;font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:600;margin-bottom:4px;transition:.12s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ico{width:20px;text-align:center;font-size:16px}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;margin:0;font-weight:700}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:.12s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.view{padding:24px;overflow:auto;flex:1}
.hidden{display:none!important}
/* ---- cards / grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .n{font-size:26px;font-weight:800}
.stat .l{color:var(--muted);font-size:12px;font-weight:600}
.stat .ic{font-size:18px}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.12s;box-shadow:var(--shadow)}
.client-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.client-card .nm{font-weight:700;font-size:15px}
.client-card .meta{color:var(--muted);font-size:12px;margin-top:3px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent3));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.blue{background:#e0f2fe;color:#0369a1}
/* ---- patient detail ---- */
.patient-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.patient-head .nm{font-size:22px;font-weight:800}
.patient-head .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tab{border:none;background:none;padding:11px 15px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none}
.pane.active{display:block}
/* ---- forms ---- */
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;font-weight:600}
.check input{width:auto}
/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:5px;border-radius:5px;background:var(--surface2)}
.step.on{background:var(--accent)}
/* ---- toast ---- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2233;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:99;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- misc ---- */
.empty{color:var(--muted);text-align:center;padding:40px;font-style:italic}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:13px}
.kv b{font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;background:var(--surface)}
.list-item .meta{color:var(--muted);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--surface2)}
.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:900px){.sidebar{width:64px}.brand span{display:none}.nav-item span{display:none}.field-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">🥗</div><span>NutriCoach</span></div>
    <div class="nav-item active" data-nav="dashboard"><span class="ico">🏠</span><span>Dashboard</span></div>
    <div class="nav-item" data-nav="pazienti"><span class="ico">👥</span><span>Pazienti</span></div>
    <div class="nav-item" data-nav="agenda"><span class="ico">📅</span><span>Agenda</span></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="search"><span class="si">🔍</span><input id="global-search" placeholder="Cerca paziente…" oninput="onGlobalSearch(this.value)"></div>
      <button class="btn primary" onclick="openNewClient()">+ Nuovo paziente</button>
      <div class="avatar" id="user-avatar" title="Nutrizionista">N</div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script>
const API = "";
let STATE = { clients:[], clientId:null, nav:"dashboard", patientTab:"anamnesi" };

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function jget(u){return fetch(API+u).then(r=>r.json());}
function jpost(u,b){return fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json().then(d=>{d._status=r.status;return d;}));}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function todayISO(){return new Date().toISOString().slice(0,10);}

/* ---- native bridge ---- */
function ncHasNative(){return (typeof window.pywebview!=='undefined'&&window.pywebview&&window.pywebview.api);}
function ncOpenExternal(url){if(ncHasNative()){try{window.pywebview.api.open_external(url);return;}catch(e){}}window.open(url,'_blank');}
async function ncDownload(filename,blob){if(ncHasNative()){try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});const r=await window.pywebview.api.download(filename,b64);if(r&&r.ok)return true;if(r&&r.error==='cancelled')return false;}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();return true;}

/* ---- nav ---- */
document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{
  const nav=el.dataset.nav;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  STATE.nav=nav;
  if(nav==='dashboard')renderDashboard();
  else if(nav==='pazienti')renderPazienti();
  else if(nav==='agenda')renderAgenda();
});

/* ============ DASHBOARD ============ */
async function renderDashboard(){
  document.getElementById('page-title').textContent='Dashboard';
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">Carico…</div>';
  let today={}, appts=[], rems=[], clients=[];
  try{
    today=await jget('/api/studio/today');
    clients=await jget('/api/clients');
    appts=await jget('/api/appointments');
    rems=await jget('/api/reminders');
  }catch(e){}
  // /api/studio/today restituisce {today:[...], count_attention:N}
  const todayClients=(today.today||[]);
  const stats=[
    {n:(clients||[]).length,l:'Pazienti',ic:'👥'},
    {n:(appts||[]).filter(a=>!a.done&&(a.appt_date||'').slice(0,10)===todayISO()).length,l:'Appuntamenti oggi',ic:'📅'},
    {n:(rems||[]).filter(r=>!r.done).length,l:'Promemoria attivi',ic:'🔔'},
    {n:(today.count_attention||0),l:'Da monitorare',ic:'⚠️'},
  ];
  const statHTML=`<div class="grid">${stats.map(s=>`<div class="card stat"><span class="ic">${s.ic}</span><span class="n">${s.n}</span><span class="l">${s.l}</span></div>`).join('')}</div>`;
  const cliHTML=todayClients.length?`<div class="grid">${todayClients.map(c=>`<div class="client-card" onclick="openPatient(${c.id})"><div class="row" style="align-items:center;gap:10px"><div class="avatar">${esc(initials(c.name))}</div><div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.goal||'—')}</div></div></div></div>`).join('')}</div>`:`<div class="grid">${(clients||[]).slice(0,6).map(c=>`<div class="client-card" onclick="openPatient(${c.id})"><div class="row" style="align-items:center;gap:10px"><div class="avatar">${esc(initials(c.name))}</div><div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.goal||'—')}</div></div></div></div>`).join('')}</div>`;
  const remHTML=(rems||[]).filter(r=>!r.done).slice(0,5).map(r=>`<div class="list-item"><span>🔔</span><div><div><b>${esc(r.title)}</b></div><div class="meta">${esc((r.due_date||'').slice(0,10)||'')} · ${esc(r.channel||'app')}</div></div></div>`).join('')||'<div class="empty">Nessun promemoria</div>';
  view.innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h2 style="margin:0 0 2px">Ciao 👋</h2><div class="meta" style="color:var(--muted)">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div></div>
    </div>
    ${statHTML}
    <div class="section-title">📋 Pazienti</div>
    ${cliHTML}
    <div class="section-title">🔔 Promemoria</div>
    ${remHTML}`;
}

/* ============ PAZIENTI ============ */
async function renderPazienti(){
  document.getElementById('page-title').textContent='Pazienti';
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">Carico…</div>';
  let clients=[];
  try{clients=await jget('/api/clients');}catch(e){}
  STATE.clients=clients;
  if(!clients.length){view.innerHTML='<div class="empty">Nessun paziente. Clicca “+ Nuovo paziente”.</div>';return;}
  view.innerHTML=`<div class="grid">${clients.map(c=>`<div class="client-card" onclick="openPatient(${c.id})"><div class="row" style="align-items:center;gap:10px"><div class="avatar">${esc(initials(c.name))}</div><div style="flex:1"><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.goal||'—')} · ${esc(c.sex||'')}</div></div><span class="badge">${esc((c.pathologies||'').length>2?'+ clinica':'base')}</span></div></div>`).join('')}</div>`;
}

function onGlobalSearch(v){
  if(STATE.nav!=='pazienti'){document.querySelector('.nav-item[data-nav="pazienti"]').click();}
  const f=v.toLowerCase();
  const grid=document.querySelector('#view .grid');
  if(!grid)return;
  grid.querySelectorAll('.client-card').forEach(c=>{
    c.style.display=c.textContent.toLowerCase().includes(f)?'':'none';
  });
}

/* ============ NUOVO PAZIENTE (wizard anamnesi) ============ */
function openNewClient(){
  STATE._wizard={step:0,conditions:[],allergies:'',notes:'',goal:'Dimagrimento',activity:'moderato'};
  loadConditions().then(()=>showWizard()).catch(()=>showWizard());
}
let _CONDITIONS=[];
async function loadConditions(){
  try{
    const d=await jget('/api/clinical-nutrition/conditions');
    const c=d.conditions||{};
    // l'endpoint puo' restituire dict {key:{name,...}} o lista
    _CONDITIONS=Array.isArray(c)?c:Object.entries(c).map(([key,v])=>({key,label:(v&&v.name)||key}));
  }catch(e){_CONDITIONS=[];}
}
function showWizard(){
  const w=STATE._wizard;
  const root=document.getElementById('modal-root');
  const steps=['Anagrafica','Obiettivi','Clinica','Conferma'];
  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>➕ Nuovo paziente — Anamnesi</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="steps">${steps.map((s,i)=>`<div class="step ${i<=w.step?'on':''}"></div>`).join('')}</div>
      <div id="wizard-body"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" ${w.step===0?'disabled':''} onclick="wizardPrev()">← Indietro</button>
      ${w.step<3?`<button class="btn primary" onclick="wizardNext()">Avanti →</button>`:`<button class="btn primary" onclick="wizardSave()">✓ Salva paziente</button>`}
    </div>
  </div></div>`;
  renderWizardStep();
}
function renderWizardStep(){
  const w=STATE._wizard;const b=document.getElementById('wizard-body');
  if(w.step===0){
    b.innerHTML=`<div class="field-row">
      <div><label>Nome *</label><input id="w-name" value="${esc(w.name||'')}" placeholder="Mario Rossi"></div>
      <div><label>Data di nascita</label><input id="w-dob" type="date" value="${esc(w.dob||'')}"></div>
    </div>
    <div class="field-row">
      <div><label>Sesso</label><select id="w-sex"><option value="M" ${w.sex==='M'?'selected':''}>Maschio</option><option value="F" ${w.sex==='F'?'selected':''}>Femmina</option></select></div>
      <div><label>Altezza (cm)</label><input id="w-h" type="number" value="${esc(w.height_cm||'')}"></div>
    </div>
    <div class="field-row">
      <div><label>Email</label><input id="w-email" value="${esc(w.email||'')}" placeholder="nome@email.it"></div>
      <div><label>Telefono</label><input id="w-phone" value="${esc(w.phone||'')}" placeholder="+39…"></div>
    </div>`;
  }else if(w.step===1){
    b.innerHTML=`<label>Obiettivo</label><select id="w-goal">
      ${['Dimagrimento','Mantenimento','Massa','Ridefinizione','Performance'].map(g=>`<option ${w.goal===g?'selected':''}>${g}</option>`).join('')}
    </select>
    <label>Livello attività</label><select id="w-act">
      ${['sedentario','leggero','moderato','attivo','atleta'].map(a=>`<option ${w.activity===a?'selected':''}>${a}</option>`).join('')}
    </select>
    <label>Note anagrafiche</label><textarea id="w-notes0" rows="2" placeholder="Lavoro, stile di vita…">${esc(w.notes0||'')}</textarea>`;
  }else if(w.step===2){
    const conds=(_CONDITIONS||[]).map(c=>`<label class="check"><input type="checkbox" value="${esc(c.key)}" ${w.conditions.includes(c.key)?'checked':''} onchange="toggleCond(this)"> ${esc(c.label||c.key)}</label>`).join('')||'<div class="empty">Nessuna condizione disponibile</div>';
    b.innerHTML=`<label>Condizioni cliniche</label>${conds}
    <label>Allergie / intolleranze</label><input id="w-all" value="${esc(w.allergies||'')}" placeholder="glutine, lattosio…">
    <label>Note anamnesi</label><textarea id="w-notes" rows="3" placeholder="Cronologia, farmaci…">${esc(w.notes||'')}</textarea>`;
  }else{
    b.innerHTML=`<div class="card"><div class="kv"><span>Nome</span><b>${esc(w.name||'—')}</b></div>
      <div class="kv"><span>Sesso</span><b>${esc(w.sex||'—')}</b></div>
      <div class="kv"><span>Obiettivo</span><b>${esc(w.goal)}</b></div>
      <div class="kv"><span>Attività</span><b>${esc(w.activity)}</b></div>
      <div class="kv"><span>Condizioni</span><b>${w.conditions.length||'—'}</b></div>
      <div class="kv"><span>Allergie</span><b>${esc(w.allergies||'—')}</b></div></div>`;
  }
}
function grabWizard(){
  const w=STATE._wizard;
  w.name=document.getElementById('w-name')?.value||'';
  w.dob=document.getElementById('w-dob')?.value||'';
  w.sex=document.getElementById('w-sex')?.value||'';
  w.height_cm=document.getElementById('w-h')?.value||'';
  w.email=document.getElementById('w-email')?.value||'';
  w.phone=document.getElementById('w-phone')?.value||'';
  w.goal=document.getElementById('w-goal')?.value||w.goal;
  w.activity=document.getElementById('w-act')?.value||w.activity;
  w.notes=document.getElementById('w-notes')?.value||w.notes||'';
  w.allergies=document.getElementById('w-all')?.value||w.allergies;
}
function toggleCond(el){const k=el.value;const w=STATE._wizard;if(el.checked){if(!w.conditions.includes(k))w.conditions.push(k);}else{w.conditions=w.conditions.filter(x=>x!==k);}}
function wizardPrev(){grabWizard();if(STATE._wizard.step>0){STATE._wizard.step--;showWizard();}}
function wizardNext(){grabWizard();if(STATE._wizard.step<3){STATE._wizard.step++;showWizard();}}
async function wizardSave(){
  const w=STATE._wizard;
  if(!w.name||!w.name.trim()){toast('Inserisci il nome');return;}
  try{
    const r=await jpost('/api/clients',{name:w.name,dob:w.dob,sex:w.sex,height_cm:w.height_cm,activity:w.activity,email:w.email,phone:w.phone,goal:w.goal,allergies:w.allergies,notes:w.notes0||''});
    if(r&&r.id){
      if(w.conditions.length||w.notes){await jpost('/api/clients/'+r.id+'/anamnesis',{conditions:w.conditions,notes:w.notes});}
      closeModal();toast('Paziente salvato ✓');
      renderPazienti();
    }else{toast('Errore salvataggio');}
  }catch(e){toast('Errore: '+e.message);}
}

/* ============ SCHEDA PAZIENTE ============ */
async function openPatient(cid){
  STATE.clientId=cid;
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">Carico paziente…</div>';
  let c=null;
  try{c=await jget('/api/clients/'+cid);}catch(e){}
  if(!c){view.innerHTML='<div class="empty">Paziente non trovato</div>';return;}
  document.getElementById('page-title').textContent=c.name;
  const tabs=[['anamnesi','📋 Anamnesi'],['misure','⚖️ Misure'],['dieta','🍽️ Dieta'],['referti','📄 Referti'],['appuntamenti','📅 Appuntamenti'],['sintomi','🩺 Sintomi'],['integratori','💊 Integratori'],['progressi','📈 Progressi']];
  view.innerHTML=`
    <div class="patient-head">
      <div class="avatar" style="width:54px;height:54px;font-size:20px">${esc(initials(c.name))}</div>
      <div style="flex:1"><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.sex||'—')} · ${esc(c.age||'—')} anni · ${esc(c.goal||'—')} · ${esc(c.email||'')}</div></div>
      <button class="btn" onclick="notifyClient(${cid},'email')">✉️ Email</button>
      <button class="btn amber" onclick="notifyClient(${cid},'whatsapp')">💬 WhatsApp</button>
    </div>
    <div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]===STATE.patientTab?'active':''}" data-tab="${t[0]}" onclick="switchPatientTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div id="patient-pane"></div>`;
  switchPatientTab(STATE.patientTab);
}
function switchPatientTab(tab){
  STATE.patientTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const pane=document.getElementById('patient-pane');
  pane.innerHTML='<div class="empty">Carico…</div>';
  if(tab==='anamnesi')loadAnamnesi();
  else if(tab==='misure')loadMisure();
  else if(tab==='dieta')loadDieta();
  else if(tab==='referti')loadReferti();
  else if(tab==='appuntamenti')loadAppuntamenti();
  else if(tab==='sintomi')loadSintomi();
  else if(tab==='integratori')loadIntegratori();
  else if(tab==='progressi')loadProgressi();
}

/* ---- Anamnesi ---- */
async function loadAnamnesi(){
  const pane=document.getElementById('patient-pane');
  let a={};
  try{a=await jget('/api/clients/'+STATE.clientId+'/anamnesis');}
  catch(e){pane.innerHTML='<div class="empty">Errore anamnesi: '+esc(e.message)+'</div>';return;}
  const conds=(a.conditions||[]).join(', ')||'—';
  const recsRaw=a.recommendations||[];
  const recsArr=Array.isArray(recsRaw)?recsRaw:Object.values(recsRaw||{});
  const recs=recsArr.map(r=>`<li>${esc(typeof r==='string'?r:(r.label||r.key||r.title||JSON.stringify(r)))}</li>`).join('')||'<li class="empty">Nessuna raccomandazione</li>';
  pane.innerHTML=`<div class="card"><div class="kv"><span>Condizioni cliniche</span><b>${esc(conds)}</b></div><div class="kv"><span>Note anamnesi</span><b>${esc(a.notes||'—')}</b></div></div>
    <div class="section-title">🎯 Raccomandazioni cliniche</div><ul>${recs}</ul>
    <button class="btn" onclick="editAnamnesi()">✏️ Modifica anamnesi</button>`;
}
function editAnamnesi(){
  STATE._wizard={step:2,conditions:[],allergies:'',notes:'',goal:'',activity:''};
  jget('/api/clients/'+STATE.clientId+'/anamnesis').then(a=>{
    STATE._wizard.conditions=a.conditions||[];STATE._wizard.notes=a.notes||'';
    STATE._wizard._edit=true;loadConditions().then(showWizard);
  });
}

/* ---- Misure ---- */
async function loadMisure(){
  const pane=document.getElementById('patient-pane');
  let ms=[];try{ms=await jget('/api/clients/'+STATE.clientId+'/measurements');}catch(e){}
  let bia=[];try{bia=await jget('/api/clients/'+STATE.clientId+'/bia');}catch(e){}
  const form=`<div class="card" style="margin-bottom:14px"><div class="field-row">
      <div><label>Data</label><input id="m-date" type="date" value="${todayISO()}"></div>
      <div><label>Peso (kg)</label><input id="m-w" type="number" step="0.1" placeholder="78.5"></div>
    </div>
    <div class="field-row">
      <div><label>Vita (cm)</label><input id="m-waist" type="number" step="0.1"></div>
      <div><label>Fianchi (cm)</label><input id="m-hip" type="number" step="0.1"></div>
    </div>
    <button class="btn primary" onclick="saveMisura()">+ Aggiungi misura</button>
    <button class="btn" onclick="document.getElementById('bia-file').click()">📄 Importa BIA (PDF)</button>
    <input id="bia-file" type="file" accept=".pdf" style="display:none" onchange="uploadBia(this)"></div>`;
  const rows=ms.slice().reverse().map(m=>`<tr><td>${esc((m.date||'').slice(0,10))}</td><td>${esc(m.weight_kg||'—')}</td><td>${esc(m.waist_cm||'—')}</td><td>${esc(m.hip_cm||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessuna misura</td></tr>';
  const biaRows=(bia||[]).map(b=>`<div class="list-item"><span>🧪</span><div><b>BIA ${esc((b.date||'').slice(0,10))}</b> · ${esc(Object.keys(b.fields||{}).length)} campi</div></div>`).join('')||'';
  pane.innerHTML=`${form}<div class="card"><div class="section-title" style="margin-top:0">Storico misure</div><table class="tbl"><thead><tr><th>Data</th><th>Peso</th><th>Vita</th><th>Fianchi</th></tr></thead><tbody>${rows}</tbody></table></div>${biaRows}`;
}
async function saveMisura(){
  const d={date:document.getElementById('m-date').value,weight_kg:document.getElementById('m-w').value,waist_cm:document.getElementById('m-waist').value,hip_cm:document.getElementById('m-hip').value};
  try{await jpost('/api/clients/'+STATE.clientId+'/measurements',d);toast('Misura salvata ✓');loadMisure();}catch(e){toast('Errore');}
}
async function uploadBia(input){
  const f=input.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await fetch(API+'/api/clients/'+STATE.clientId+'/bia/upload',{method:'POST',body:fd}).then(r=>r.json());
    if(r.scanned){toast('PDF scansionato: incolla il testo OCR nella tab Referti');}else{toast('BIA importata ✓');}
    loadMisure();
  }catch(e){toast('Errore upload BIA');}
}

/* ---- Dieta / Pianifica per data ---- */
async function loadDieta(){
  const pane=document.getElementById('patient-pane');
  let diets=[];try{diets=await jget('/api/clients/'+STATE.clientId+'/diets');}catch(e){}
  pane.innerHTML=`<div class="card" style="margin-bottom:14px">
      <div class="section-title" style="margin-top:0">🤖 Pianifica per periodo</div>
      <div class="field-row">
        <div><label>Data inizio</label><input id="p-start" type="date" value="${todayISO()}"></div>
        <div><label>Data fine</label><input id="p-end" type="date" onchange="calcWeeks()"></div>
      </div>
      <div class="field-row">
        <div><label>Settimane (auto)</label><input id="p-weeks" type="number" value="4" readonly></div>
        <div><label>kcal target</label><input id="p-kcal" type="number" value="2000"></div>
      </div>
      <div class="field-row">
        <div><label>Proteine (g)</label><input id="p-prot" type="number" value="140"></div>
        <div><label>Carbo (g)</label><input id="p-carb" type="number" value="220"></div>
      </div>
      <button class="btn primary" onclick="generatePlan()">⚡ Genera piano</button>
      <span id="p-status" style="margin-left:10px;color:var(--muted)"></span>
    </div>
    <div class="card"><div class="section-title" style="margin-top:0">Diete salvate</div>
    ${(diets||[]).map(d=>`<div class="list-item"><span>🍽️</span><div style="flex:1"><b>${esc(d.title||'Dieta')}</b> <span class="meta">${esc(d.date||'')}</span></div><button class="btn sm" onclick="exportDiet(${d.id})">PDF</button></div>`).join('')||'<div class="empty">Nessuna dieta</div>'}</div>`;
}
function calcWeeks(){
  const s=document.getElementById('p-start').value,e=document.getElementById('p-end').value;
  if(s&&e){const days=(new Date(e)-new Date(s))/86400000;document.getElementById('p-weeks').value=Math.max(1,Math.round(days/7));}
}
async function generatePlan(){
  const targets={kcal:+document.getElementById('p-kcal').value,protein:+document.getElementById('p-prot').value,carbs:+document.getElementById('p-carb').value};
  const weeks=+document.getElementById('p-weeks').value;
  document.getElementById('p-status').textContent='Genero…';
  try{
    const r=await jpost('/api/clients/'+STATE.clientId+'/plan/generate',{targets,options:{weeks}});
    if(r&&r.diet_id){toast('Piano generato ✓');document.getElementById('p-status').textContent='✓ '+weeks+' settimane';loadDieta();}
    else{document.getElementById('p-status').textContent='errore';}
  }catch(e){document.getElementById('p-status').textContent='errore';toast('Errore piano');}
}
async function exportDiet(did){
  try{
    const r=await fetch(API+'/api/diets/'+did+'/export-html',{method:'POST',body:JSON.stringify({})}).then(r=>r.blob());
    ncDownload('dieta_'+did+'.html',r);toast('Dieta esportata ✓');
  }catch(e){toast('Errore export');}
}

/* ---- Referti ---- */
async function loadReferti(){
  const pane=document.getElementById('patient-pane');
  pane.innerHTML=`<div class="card"><div class="section-title" style="margin-top:0">📄 Referti / BIA</div>
    <button class="btn" onclick="document.getElementById('ref-file').click()">📄 Carica referto PDF</button>
    <input id="ref-file" type="file" accept=".pdf" style="display:none" onchange="uploadRef(this)">
    <div id="ref-list" class="empty" style="margin-top:12px">Carico…</div></div>`;
  let bia=[];try{bia=await jget('/api/clients/'+STATE.clientId+'/bia');}catch(e){}
  document.getElementById('ref-list').innerHTML=(bia||[]).map(b=>`<div class="list-item"><span>🧪</span><div style="flex:1"><b>BIA ${esc((b.date||'').slice(0,10))}</b></div><button class="btn sm" onclick="pasteOcr(${STATE.clientId})">OCR testo</button></div>`).join('')||'<div class="empty">Nessun referto</div>';
}
async function uploadRef(input){
  const f=input.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
  try{const r=await fetch(API+'/api/clients/'+STATE.clientId+'/bia/upload',{method:'POST',body:fd}).then(r=>r.json());
    if(r.scanned){toast('PDF scansionato: incolla il testo OCR');pasteOcr(STATE.clientId,r);}else{toast('Referto importato ✓');loadReferti();}}catch(e){toast('Errore');}
}
function pasteOcr(cid,r){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>Incolla testo OCR</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><textarea id="ocr-text" rows="10" placeholder="Incolla qui il testo estratto dal PDF scansionato…"></textarea></div>
    <div class="modal-foot"><button class="btn primary" onclick="sendOcr(${cid})">Estrai misure</button></div></div></div>`;
}
async function sendOcr(cid){
  const t=document.getElementById('ocr-text').value;
  try{await jpost('/api/clients/'+cid+'/bia/paste',{text:t,date:todayISO()});closeModal();toast('BIA da OCR importata ✓');loadReferti();}catch(e){toast('Errore');}
}

/* ---- Appuntamenti ---- */
async function loadAppuntamenti(){
  const pane=document.getElementById('patient-pane');
  let appts=[];try{appts=await jget('/api/appointments?client_id='+STATE.clientId);}catch(e){}
  pane.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="field-row">
      <div><label>Titolo</label><input id="a-title" placeholder="Controllo peso"></div>
      <div><label>Data</label><input id="a-date" type="date" value="${todayISO()}"></div>
    </div>
    <button class="btn primary" onclick="saveAppt()">+ Aggiungi appuntamento</button></div>
    <div>${(appts||[]).map(a=>`<div class="list-item"><span>📅</span><div style="flex:1"><b>${esc(a.title)}</b> <span class="meta">${esc((a.appt_date||'').slice(0,10))}</span></div>${a.done?'<span class="badge ok">fatto</span>':`<button class="btn sm" onclick="doneAppt(${a.id})">✓</button>`}</div>`).join('')||'<div class="empty">Nessun appuntamento</div>'}</div>`;
}
async function saveAppt(){
  const title=document.getElementById('a-title').value;const date=document.getElementById('a-date').value;
  if(!title){toast('Inserisci titolo');return;}
  try{await jpost('/api/clients/'+STATE.clientId+'/appointments',{title,note:'',appt_date:date});toast('Appuntamento salvato ✓');loadAppuntamenti();}catch(e){toast('Errore');}
}
async function doneAppt(aid){try{await fetch(API+'/api/appointments/'+aid+'/done',{method:'PUT'}).then(r=>r.json());loadAppuntamenti();}catch(e){}}

/* ---- Sintomi ---- */
async function loadSintomi(){
  const pane=document.getElementById('patient-pane');
  pane.innerHTML=`<div class="card"><div class="field-row">
      <div><label>Data</label><input id="s-date" type="date" value="${todayISO()}"></div>
      <div><label>Gonfiore</label><input id="s-bloat" type="number" min="0" max="10"></div>
    </div>
    <div class="field-row">
      <div><label>Dolore</label><input id="s-pain" type="number" min="0" max="10"></div>
      <div><label>Gas</label><input id="s-gas" type="number" min="0" max="10"></div>
    </div>
    <button class="btn primary" onclick="saveSint()">+ Registra sintomo</button></div>`;
}
async function saveSint(){
  const d={date:document.getElementById('s-date').value,bloating:+document.getElementById('s-bloat').value||0,pain:+document.getElementById('s-pain').value||0,gas:+document.getElementById('s-gas').value||0};
  try{await jpost('/api/clients/'+STATE.clientId+'/symptoms',d);toast('Sintomo salvato ✓');loadSintomi();}catch(e){toast('Errore');}
}

/* ---- Integratori ---- */
async function loadIntegratori(){
  const pane=document.getElementById('patient-pane');
  pane.innerHTML=`<div class="card"><div class="field-row">
      <div><label>Nome</label><input id="sup-name" placeholder="Vitamina D"></div>
      <div><label>Dose</label><input id="sup-dose" placeholder="2000 UI"></div>
    </div>
    <button class="btn primary" onclick="saveSup()">+ Aggiungi integratore</button></div>`;
}
async function saveSup(){
  const name=document.getElementById('sup-name').value;if(!name){toast('Inserisci nome');return;}
  try{await jpost('/api/clients/'+STATE.clientId+'/supplements',{date:todayISO(),name,dose:document.getElementById('sup-dose').value});toast('Integratore salvato ✓');loadIntegratori();}catch(e){toast('Errore');}
}

/* ---- Progressi ---- */
async function loadProgressi(){
  const pane=document.getElementById('patient-pane');
  pane.innerHTML=`<div class="card"><div class="field-row">
      <div><label>Data</label><input id="pn-date" type="date" value="${todayISO()}"></div>
      <div></div>
    </div>
    <label>Nota di progresso</label><textarea id="pn-text" rows="3" placeholder="Compliance, energia, umore…"></textarea>
    <button class="btn primary" onclick="savePn()">+ Aggiungi nota</button></div>`;
}
async function savePn(){
  const text=document.getElementById('pn-text').value;if(!text){toast('Scrivi una nota');return;}
  try{await jpost('/api/clients/'+STATE.clientId+'/progress-note',{date:document.getElementById('pn-date').value,text});toast('Nota salvata ✓');loadProgressi();}catch(e){toast('Errore');}
}

/* ---- Email / WhatsApp ---- */
async function notifyClient(cid,channel){
  const subject=prompt('Oggetto '+channel+':','Piano nutrizionale');
  if(subject===null)return;
  const body=prompt('Messaggio:','In allegato il tuo piano.');
  if(body===null)return;
  try{
    const r=await jpost('/api/clients/'+cid+'/notify',{type:'piano',channel,subject,body});
    if(r.mailto)ncOpenExternal(r.mailto);
    else if(r.wa_link)ncOpenExternal(r.wa_link);
    toast(channel==='email'?'Email pronta ✓':'WhatsApp pronto ✓');
  }catch(e){toast('Errore invio');}
}

/* ---- Agenda ---- */
async function renderAgenda(){
  document.getElementById('page-title').textContent='Agenda';
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">Carico…</div>';
  let appts=[];try{appts=await jget('/api/appointments');}catch(e){}
  const open=(appts||[]).filter(a=>!a.done);
  const done=(appts||[]).filter(a=>a.done);
  const render=a=>`<div class="list-item"><span>📅</span><div style="flex:1"><b>${esc(a.title)}</b> <span class="meta">${esc((a.appt_date||'').slice(0,10))} · cliente #${a.client_id}</span></div>${a.done?'<span class="badge ok">fatto</span>':`<button class="btn sm" onclick="doneAppt(${a.id})">✓</button>`}</div>`;
  view.innerHTML=`<div class="section-title">Da fare</div>${open.map(render).join('')||'<div class="empty">Nessun appuntamento</div>'}
    <div class="section-title">Completati</div>${done.map(render).join('')||'<div class="empty">—</div>'}`;
}

/* ---- modal utils ---- */
function closeModal(){document.getElementById('modal-root').innerHTML='';}

/* ---- boot ---- */
(async function(){
  try{
    const v=await jget('/api/version');
    document.getElementById('side-foot').textContent='v'+(v.version||'?');
  }catch(e){document.getElementById('side-foot').textContent='';}
  renderDashboard();
})();
</script>
