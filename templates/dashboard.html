<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriCoach</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
:root{--bg:#f1f4f9;--surface:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--primary:#10b981;--primary2:#059669;--danger:#ef4444;--warn:#f59e0b;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--nav-w:210px;--top-h:54px}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{padding:16px 18px;font-size:17px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--border)}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 18px;cursor:pointer;color:var(--text2);transition:.15s;font-size:13px;margin:1px 8px;border-radius:8px}
.nav-item:hover{background:#f8fafc;color:var(--text)}
.nav-item.active{color:var(--primary);background:#ecfdf5;font-weight:600}
.nav-item .ico{font-size:16px;width:20px;text-align:center}
.sidebar .spacer{flex:1}
.sidebar .version{padding:10px 18px;font-size:11px;color:var(--text2);border-top:1px solid var(--border)}
.main{margin-left:var(--nav-w);flex:1}
.topbar{height:var(--top-h);display:flex;align-items:center;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);gap:10px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:600}
.search{flex:1;max-width:280px}
.search input{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none}
.search input:focus{border-color:var(--primary)}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.outline:hover{background:#f8fafc}
.avatar{width:30px;height:30px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.view{padding:16px 18px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.grid{display:grid;gap:10px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.stat-card{text-align:center;padding:14px 10px}
.stat-card .num{font-size:26px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:3px}
.empty{padding:24px;text-align:center;color:var(--text2);font-size:13px}
.patient-card{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;border-radius:6px;transition:.15s}
.patient-card:hover{background:#f8fafc}
.patient-card .init{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.patient-card .info{flex:1;min-width:0}
.patient-card .name{font-weight:500;font-size:13px}
.patient-card .meta{font-size:11px;color:var(--text2)}
.patient-card .cat{font-size:10px;padding:1px 6px;border-radius:10px;display:inline-block}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:12px;width:540px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.modal-head button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text2);padding:0 4px}
.modal-body{padding:14px 18px}
.modal-foot{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:2px;margin-top:8px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:40px}
.field-row{display:flex;gap:8px}
.field-row>*{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 8px;text-align:left;font-weight:500;color:var(--text2);border-bottom:2px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:500}
.badge.green{background:#ecfdf5;color:#059669}
.badge.red{background:#fef2f2;color:#dc2626}
.badge.yellow{background:#fffbeb;color:#d97706}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab-btn{padding:8px 14px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.grid-4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo">🥗 NutriCoach</div>
<div class="nav-item active" data-nav="dashboard" onclick="switchNav('dashboard')"><span class="ico">📊</span> Dashboard</div>
<div class="nav-item" data-nav="pazienti" onclick="switchNav('pazienti')"><span class="ico">👥</span> Pazienti</div>
<div class="nav-item" data-nav="bia" onclick="switchNav('bia')"><span class="ico">🔬</span> BIA</div>
<div class="nav-item" data-nav="agenda" onclick="switchNav('agenda')"><span class="ico">📅</span> Agenda</div>
<div class="nav-item" data-nav="notifiche" onclick="switchNav('notifiche')"><span class="ico">📨</span> Notifiche</div>
<div class="nav-item" data-nav="archivio" onclick="switchNav('archivio')"><span class="ico">📁</span> Archivio</div>
<div class="nav-item" data-nav="dieta" onclick="switchNav('dieta')"><span class="ico">🍽️</span> Dieta</div>
<div class="spacer"></div>
<div class="version">v1.6.4</div>
</div>
<div class="main">
<div class="topbar">
<h1 id="page-title">Dashboard</h1>
<div class="search"><input id="global-search" placeholder="Cerca paziente..." oninput="onSearch(this.value)"></div>
<button class="btn primary" onclick="openNewClient()">+ Nuovo</button>
<div class="avatar">N</div>
</div>
<div class="view" id="view"></div>
</div>
</div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
const API="";const V="1.6.0";
let STATE={nav:"dashboard",clients:[],clientId:null,categories:[],groups:[]};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function $(id){return document.getElementById(id)}
function jget(u){return fetch(API+u).then(r=>r.json())}
function jpost(u,b){return fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())}
function jput(u,b){return fetch(API+u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json())}
function jdel(u){return fetch(API+u,{method:'DELETE'}).then(r=>r.json())}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function init(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function clr(){return ['#10b981','#6366f1','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4'][Math.floor(Math.random()*9)]}

/* ============ NAV ============ */
function setActiveNav(nav){
  STATE.nav=nav;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===nav));
}
async function switchNav(nav){
  setActiveNav(nav);
  $('page-title').textContent={dashboard:'Dashboard',pazienti:'Pazienti',bia:'BIA & Misure',agenda:'Agenda',notifiche:'Notifiche',archivio:'Archivio',dieta:'Dieta'}[nav]||'NutriCoach';
  const v=$('view');
  if(nav==='dashboard'){await loadDashboard();return}
  if(nav==='pazienti'){await loadPazienti();return}
  if(nav==='bia'){await loadBIA();return}
  if(nav==='agenda'){await loadAgenda();return}
if(nav==='notifiche'){await loadNotifiche();return}
  if(nav==='archivio'){await loadArchivio();return}
  if(nav==='dieta'){v.innerHTML='<div class="empty">🍽️ Generatore dieta (in arrivo)</div>';return}
}

/* ============ DASHBOARD ============ */
async function loadDashboard(){
  const[todayData,clients,reminders]=await Promise.all([
    jget('/api/studio/today'),jget('/api/clients'),jget('/api/reminders')
  ]);
  const countPaz=clients.length;
  const countOggi=todayData.today?todayData.today.length:0;
  const countAlert=todayData.count_attention||0;
  const countProm=reminders.filter(r=>!r.done).length;
  const cats=await jget('/api/categories');
  // arricchisci clienti con categoria
  const catMap={};cats.forEach(c=>catMap[c.id]=c);
  clients.forEach(c=>{if(c.category_id)c._cat=catMap[c.category_id]||null});
  STATE.clients=clients;STATE.categories=cats;
  $('view').innerHTML=`
<div class="grid grid-4">
  <div class="card stat-card"><div class="num">${countPaz}</div><div class="label">👥 Pazienti</div></div>
  <div class="card stat-card"><div class="num">${countOggi}</div><div class="label">📅 Oggi</div></div>
  <div class="card stat-card"><div class="num">${countProm}</div><div class="label">🔔 Promemoria</div></div>
  <div class="card stat-card"><div class="num">${countAlert}</div><div class="label">⚠️ Da monitorare</div></div>
</div>
<div class="card"><b>👥 Pazienti (${countPaz})</b><div class="row" style="margin:6px 0">${cats.map(c=>`<span class="badge" style="background:${c.color}22;color:${c.color}">${esc(c.name)}</span>`).join('')}</div>
  ${clients.map(c=>`<div class="patient-card" onclick="openPatient(${c.id})"><div class="init" style="background:${c._cat?c._cat.color:clr()}">${init(c.name)}</div><div class="info"><div class="name">${esc(c.name)} ${c._cat?`<span class="cat" style="background:${c._cat.color}22;color:${c._cat.color}">${esc(c._cat.name)}</span>`:''}</div><div class="meta">${c.sex||'?'} · ${c.goal||'—'}</div></div></div>`).join('')}
</div>
<div class="card"><b>🔔 Promemoria</b>${reminders.filter(r=>!r.done).slice(0,5).map(r=>`
  <div class="patient-card"><div class="info"><div class="name">${esc(r.title)}</div><div class="meta">${r.due_date||''} · ${r.channel||'app'}</div></div></div>`).join('')||'<div class="empty">Nessun promemoria</div>'}
</div>`;
}

/* ============ PAZIENTI ============ */
async function loadPazienti(){
  const[clients,cats,grps]=await Promise.all([jget('/api/clients'),jget('/api/categories'),jget('/api/groups')]);
  STATE.clients=clients;STATE.categories=cats;STATE.groups=grps;
  const catMap={};cats.forEach(c=>catMap[c.id]=c);
  clients.forEach(c=>{if(c.category_id)c._cat=catMap[c.category_id]||null});
  $('view').innerHTML=`
<div class="row" style="margin-bottom:10px">
  <select id="pz-filter-cat" onchange="loadPazienti()" style="width:auto">
    <option value="">Tutte le categorie</option>
    ${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
  </select>
  <button class="btn outline" onclick="showCategoryModal()">📂 Gestisci categorie</button>
  <button class="btn outline" onclick="showGroupModal()">👥 Gestisci gruppi</button>
</div>
<div class="card">
  <div class="row" style="margin-bottom:8px"><b>👥 Pazienti (${clients.length})</b></div>
  ${clients.filter(c=>!$('pz-filter-cat').value||c.category_id==+$('pz-filter-cat').value).map(c=>`
  <div class="patient-card" onclick="openPatient(${c.id})">
    <div class="init" style="background:${c._cat?c._cat.color:clr()}">${init(c.name)}</div>
    <div class="info"><div class="name">${esc(c.name)} ${c._cat?`<span class="cat" style="background:${c._cat.color}22;color:${c._cat.color}">${esc(c._cat.name)}</span>`:''}</div>
    <div class="meta">${c.sex||'?'} · ${c.goal||'—'} · ${c.email||''}</div></div>
    <button class="btn sm danger" onclick="event.stopPropagation();deleteClient(${c.id})">✕</button>
  </div>`).join('')||'<div class="empty">Nessun paziente</div>'}
</div>`;
}

async function deleteClient(cid){
  if(!confirm('Eliminare questo paziente e tutti i suoi dati?'))return;
  await jpost('/api/clients/{cid}'.replace('{cid}',cid),{_method:'DELETE'});
  // use DELETE method properly
  await fetch(API+'/api/clients/'+cid,{method:'DELETE'});
  toast('Paziente eliminato');loadPazienti();
}

function showCategoryModal(){
  const c=STATE.categories;
  modal(`
<div class="card"><b>📂 Categorie</b><div class="empty">${c.length?'':'Nessuna categoria'}</div>
${c.map(cat=>`<div class="patient-card"><div class="info"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cat.color};margin-right:6px"></span> ${esc(cat.name)}</div><button class="btn sm danger" onclick="if(confirm('Eliminare?')){fetch('/api/categories/${cat.id}',{method:'DELETE'}).then(()=>{closeModal();showCategoryModal()})}">✕</button></div>`).join('')}
<hr style="margin:10px 0">
<div class="field-row"><input id="nc-name" placeholder="Nome"><input id="nc-color" type="color" value="#6366f1"></div>
<button class="btn primary" onclick="const n=$('nc-name').value;if(!n)return;fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,color:$('nc-color').value})}).then(()=>{closeModal();loadPazienti()})">➕ Aggiungi</button></div>`);
}

function showGroupModal(){
  modal(`
<div class="card"><b>👥 Gruppi</b>
${STATE.groups.map(g=>`<div class="patient-card"><div class="info"><b>${esc(g.name)}</b><div class="meta">${g.member_count||0} membri</div></div>
<button class="btn sm danger" onclick="if(confirm('Eliminare?')){fetch('/api/groups/${g.id}',{method:'DELETE'}).then(()=>{closeModal();showGroupModal()})}">✕</button></div>`).join('')||'<div class="empty">Nessun gruppo</div>'}
<hr style="margin:10px 0">
<div class="field-row"><input id="ng-name" placeholder="Nome gruppo"><button class="btn primary" onclick="const n=$('ng-name').value;if(!n)return;fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}).then(()=>{closeModal();showGroupModal()})">➕ Crea</button></div></div>`);
}

/* ============ AGENDA ============ */
async function loadAgenda(){
  const[openAppts,closedAppts,fups]=await Promise.all([
    jget('/api/appointments?status=open'),
    jget('/api/appointments?status=closed'),
    jget('/api/follow-ups')
  ]);
  const today=new Date().toISOString().slice(0,10);
  const oggi=openAppts.filter(a=>a.appt_date===today);
  const prox=openAppts.filter(a=>a.appt_date&&a.appt_date>today).slice(0,10);
  $('view').innerHTML=`
<div class="row" style="margin-bottom:10px"><b>📅 Agenda</b>
<button class="btn primary" onclick="showApptModal()">➕ Nuovo appuntamento</button></div>
<div class="grid grid-4">${[
  ['📅 Oggi',oggi.length],
  ['🔄 In programma',openAppts.length],
  ['✅ Completati',closedAppts.length],
  ['📌 Follow-up',fups.length]
].map(x=>`<div class="card stat-card"><div class="num">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div>
<div class="card"><b>📅 Oggi (${today})</b>${oggi.map(a=>apptCard(a)).join('')||'<div class="empty">Nessun appuntamento oggi</div>'}</div>
<div class="card"><b>🔜 Prossimi</b>${prox.map(a=>apptCard(a)).join('')||'<div class="empty">Nessun appuntamento in programma</div>'}</div>
<div class="card"><b>📌 Follow-up attivi</b>${fups.map(a=>apptCard(a)).join('')||'<div class="empty">Nessun follow-up attivo</div>'}</div>`;
}

function apptCard(a){
  return `<div class="patient-card" style="border-left:3px solid ${a.status==='closed'?'var(--primary)':a.status==='cancelled'?'var(--danger)':'var(--warn)'}">
<div class="info"><b>${esc(a.title)}</b><div class="meta">${esc(a.client_name||'')} · ${a.appt_date||'—'} ${a.follow_up?'· 🔄 Follow-up':''}</div></div>
<button class="btn sm outline" onclick="jpost('/api/appointments/${a.id}/done',{done:${a.status==='closed'?0:1}}).then(()=>loadAgenda())">${a.status==='closed'?'✓ Fatto':'✗ Chiudi'}</button>
</div>`;
}

function showApptModal(cid,aid){
  let title="Nuovo appuntamento",data={client_id:cid||'',title:'',note:'',appt_date:'',status:'open',follow_up:0};
  if(aid){
    // prefetch per modifica
    jget('/api/appointments').then(all=>{
      const a=all.find(x=>x.id===aid);
      if(!a)return;
      const clientSel=STATE.clients.find(c=>c.id===a.client_id);
      data=a;
      renderApptModal(aid,data);
    });
    return;
  }
  renderApptModal(0,data);

  function renderApptModal(aid,d){
    const clients=STATE.clients.length?STATE.clients:[];
    modal(`
<div class="card"><b>${aid?'Modifica':'Nuovo'} appuntamento</b>
<label>Paziente</label><select id="ap-cid">${clients.map(c=>`<option value="${c.id}" ${d.client_id==c.id?'selected':''}>${esc(c.name)}</option>`).join('')||'<option value="">—</option>'}</select>
<div class="field-row"><div><label>Titolo</label><input id="ap-title" value="${esc(d.title)}" placeholder="Controllo peso"></div>
<div><label>Data</label><input type="date" id="ap-date" value="${d.appt_date||''}"></div></div>
<label>Note</label><textarea id="ap-note" rows="2">${esc(d.note||'')}</textarea>
<label class="row" style="margin-top:6px"><input type="checkbox" id="ap-fup" ${d.follow_up?'checked':''}> 🔄 Richiede follow-up</label>
<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn primary" onclick="saveAppt(${aid})">💾 Salva</button>
${aid?`<button class="btn danger" onclick="jpost('/api/appointments/${aid}/done',{done:1}).then(()=>{closeModal();loadAgenda()})">✓ Chiudi</button>`:''}
<button class="btn outline" onclick="closeModal()">Annulla</button></div></div>`);
  }
}

async function saveAppt(aid){
  const cid=+$('ap-cid').value;
  if(!cid){toast('Seleziona un paziente');return}
  const body={client_id:cid,title:$('ap-title').value,appt_date:$('ap-date').value,
    note:$('ap-note').value,follow_up:$('ap-fup').checked?1:0};
  if(aid){
    await fetch(API+'/api/appointments/'+aid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }else{
    await jpost('/api/appointments',body);
  }
  toast('Salvato ✓');closeModal();
  if(STATE.nav==='agenda')loadAgenda();else loadAppuntamenti();
}

/* ============ NOTIFICHE ============ */
async function loadNotifiche(){
  const[notifs,clients,groups]=await Promise.all([
    jget('/api/notifications?status=pending'),
    jget('/api/clients'),
    jget('/api/groups')
  ]);
  STATE.clients=clients;
  const sent=await jget('/api/notifications?status=sent');
  const cMap={};clients.forEach(c=>cMap[c.id]=c);
  $('view').innerHTML=`
<div class="row" style="margin-bottom:10px"><b>📨 Notifiche & Promemoria</b>
<button class="btn primary" onclick="genNotifiche()">🔄 Genera dovute</button></div>
<div class="card"><b>📤 Invio bulk per gruppo</b>
<div class="field-row"><div><label>Gruppo</label><select id="nt-grp">${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')||'<option value="">—</option>'}</select></div>
<div><label>Canale</label><select id="nt-ch"><option value="whatsapp">WhatsApp</option><option value="email">Email</option></select></div>
<button class="btn primary" onclick="bulkNotifiche()">📨 Invia a gruppo</button></div></div>
<div class="card"><b>📋 Coda (${notifs.length} da inviare)</b>
${notifs.map(n=>`<div class="patient-card"><div class="info"><b>${esc((cMap[n.client_id]||{}).name||'Cliente '+n.client_id)}</b><div class="meta">${n.type} · ${n.channel} · ${n.due_date||''}</div></div>

async function genNotifiche(){
  // genera per ogni cliente
  const clients=STATE.clients.length?STATE.clients:await jget('/api/clients');
  let tot=0;
  for(const c of clients){
    const r=await jpost('/api/clients/'+c.id+'/notifications/generate',{});
    tot+=(r&&r.count)||0;
  }
  toast(`Generate ${tot} notifiche`);
  loadNotifiche();
}

async function sendNotifica(nid,channel){
  const n=await jget('/api/notifications?status=pending').then(list=>list.find(x=>x.id===nid));
  if(!n)return;
  const client=await jget('/api/clients/'+n.client_id).catch(()=>({}));
  channel=channel||n.channel;
  if(channel==='whatsapp'){
    const phone=(client.phone||'').replace(/\D/g,'');
    if(phone) window.open('https://wa.me/'+phone+'?text='+encodeURIComponent('Ciao '+client.name+', ti scrivo da NutriCoach per il tuo '+n.type),'_blank');
    else toast('Telefono mancante per WhatsApp');
  }else if(channel==='email'){
    if(client.email) window.open('mailto:'+client.email+'?subject='+encodeURIComponent('NutriCoach — '+n.type)+'&body='+encodeURIComponent('Ciao '+client.name),'_blank');
    else toast('Email mancante');
  }
  await jput('/api/notifications/'+nid+'/sent',{sent:true});
  loadNotifiche();
}

async function bulkNotifiche(){
  const gid=+$('nt-grp').value;
  const ch=$('nt-ch').value;
  if(!gid){toast('Seleziona un gruppo');return;}
  const members=await jget('/api/groups/'+gid+'/members');
  let ok=0;
  for(const m of members){
    const client=await jget('/api/clients/'+m.client_id).catch(()=>({}));
    if(ch==='whatsapp'){
      const phone=(client.phone||'').replace(/\D/g,'');
      if(phone) window.open('https://wa.me/'+phone+'?text='+encodeURIComponent('Ciao '+client.name+' da NutriCoach'),'_blank');
    }else if(ch==='email'&&client.email){
      window.open('mailto:'+client.email+'?subject='+encodeURIComponent('NutriCoach')+'&body='+encodeURIComponent('Ciao '+client.name),'_blank');
    }
    ok++;
  }
  toast('Aperte '+ok+' finestre di invio');
}

async function loadBIAReading(){
  const cid=+$('bia-client').value;
  if(!cid){$('bia-view').innerHTML='<div class=empty>Seleziona un paziente</div>';return}
  const[readings,trends]=await Promise.all([
    jget('/api/clients/'+cid+'/bia-readings'),
    jget('/api/clients/'+cid+'/bia-trend?field=weight_kg&days=365')
  ]);
  let html=`<div class="card"><b>📊 Trend peso</b><div class="empty">${trends.length?'':'Nessun dato'}</div>`;
  if(trends.length>1){
    const min=Math.min(...trends.map(t=>t.weight_kg))-2;
    const max=Math.max(...trends.map(t=>t.weight_kg))+2;
    const rng=max-min||1;const h=100;
    html+=`<svg viewBox="0 0 ${(trends.length-1)*50} ${h}" width="100%" height="120" style="margin:6px 0">`;
    const pts=trends.map((t,i)=>`${i*50},${h-((t.weight_kg-min)/rng)*h}`);
    html+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2"/>`;
    pts.forEach((p,i)=>html+=`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="var(--primary)"/>`);
    const last=trends[trends.length-1];const first=trends[0];
    const chg=(last.weight_kg-first.weight_kg).toFixed(1);
    html+=`</svg><div style="font-size:11px;color:var(--text2)">${first.weight_kg} → ${last.weight_kg} (${chg>0?'+':''}${chg} kg)</div>`;
  }
  html+=`</div><div class="card"><b>📋 Storico BIA</b>`;
  if(readings.length){
    html+=`<table><tr><th>Data</th><th>Peso</th><th>BF%</th><th>MM%</th><th>PhA</th><th>TBW</th><th>BMR</th><th></th></tr>`;
    readings.forEach(r=>{
      html+=`<tr><td>${esc(r.date)}</td><td>${r.weight_kg||'—'}</td><td>${r.bf_pct||'—'}</td>
        <td>${r.mm_pct||'—'}</td><td>${r.pha||'—'}</td><td>${r.tbw_l||'—'}</td>
        <td>${r.bmr_kcal||'—'}</td>
        <td><button class="btn sm outline" onclick="showBIAForm(${r.id})">📝</button>
        <button class="btn sm danger" onclick="if(confirm('Eliminare?')){fetch('/api/bia-readings/${r.id}',{method:'DELETE'}).then(()=>loadBIAReading())}">✕</button></td></tr>`;
    });
    html+=`</table>`;
  }else{html+=`<div class="empty">Nessuna misurazione. Carica un PDF BIA o inserisci manualmente.</div>`}
  html+=`</div>`;
  $('bia-view').innerHTML=html;
}

<button class="btn sm ${a.status==='closed'?'outline':'primary'}" onclick="jpost('/api/appointments/${a.id}/done',{done:${a.status==='closed'?0:1}}).then(()=>loadAppuntamenti())">${a.status==='closed'?'✓ Fatto':'🔴 Apri'}</button>
</div>`).join('')||'<div class="empty">Nessun appuntamento</div>'}
</div>`;
}

async function loadSintomi(){
  $('patient-pane').innerHTML=`<div class="empty">🩺 Sintomi (in arrivo)</div>`;
}

async function loadGruppi(){
  const gs=await jget('/api/clients/'+STATE.clientId+'/groups');
  const all=await jget('/api/groups');
  $('patient-pane').innerHTML=`<div class="card"><b>👥 Gruppi</b>
${all.map(g=>`<label class="row" style="cursor:pointer;padding:4px 0"><input type="checkbox" ${gs.find(x=>x.id===g.id)?'checked':''} onchange="if(this.checked){fetch('/api/groups/${g.id}/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:${STATE.clientId}})}).then(()=>toast('Aggiunto'))}else{fetch('/api/groups/${g.id}/members/${STATE.clientId}',{method:'DELETE'}).then(()=>toast('Rimosso'))}"> <b>${esc(g.name)}</b> <span class="meta">(${g.member_count||0})</span></label>`).join('')||'<div class="empty">Nessun gruppo. Creane uno dalla pagina Pazienti.</div>'}
</div>`;
}

async function loadProgressi(){
  $('patient-pane').innerHTML=`<div class="empty">📈 Progressi (in arrivo)</div>`;
}

/* ============ INIT ============ */
switchNav('dashboard');
</script>
</body>
</html>
